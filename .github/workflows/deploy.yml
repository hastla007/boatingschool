name: Deploy

# Deploy per Knopfdruck (Actions → Deploy → Run workflow). Läuft nie
# automatisch. Führt auf dem Server deploy/deploy.sh aus.
#
# Ziel: Eingabe „environment“ = production (Standard) oder staging. Sie wählt
# die gleichnamige GitHub-Umgebung (Settings → Environments); die Secrets
# liegen JE UMGEBUNG dort (nicht als Repository-Secrets), damit Staging nie
# mit den Zugangsdaten der Produktion ausrollt:
#   DEPLOY_HOST         Hostname oder IP des Servers
#   DEPLOY_USER         SSH-Benutzer (Deploy-Benutzer, nicht root)
#   DEPLOY_SSH_KEY      privater SSH-Schlüssel (nur für diesen Zweck erzeugen)
#   DEPLOY_KNOWN_HOSTS  Ausgabe von `ssh-keyscan <host>` (schützt vor fremden Servern)
#   DEPLOY_PATH         App-Verzeichnis, z. B. /var/www/boatingschool
#                       (Modus releases: <basis>/current, siehe deploy/README.md)
#
# production: nur `main`, und nur ein Stand, für den der Workflow „Tests“
# grün ist (zusätzlich in der Umgebung „production“ unter „Deployment
# branches“ nur main erlauben). staging: jeder Branch, dessen Stand grün
# getestet ist (Workflow vom gewünschten Branch aus starten). Der geprüfte
# Commit wird an deploy.sh übergeben, damit genau dieser Stand auf den
# Server kommt (auch wenn der Branch inzwischen weiter ist).
#
# Die Frontend-Assets (public/build) baut der Job „build“ für genau diesen
# Commit; der Deploy kopiert sie per scp in ein temporäres Verzeichnis auf dem
# Server, deploy.sh übernimmt sie (BUILD_DIR) statt im Wartungsmodus zu bauen.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ziel (GitHub-Umgebung mit eigenen Secrets): production nur von main, staging von jedem grün getesteten Branch'
        type: choice
        options:
          - production
          - staging
        default: production
      with_content:
        description: 'Inhalte (db:seed) auch ohne Änderungen unter database/seeders bzw. database/data einspielen'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.verified.outputs.sha }}
      branch: ${{ steps.verified.outputs.branch }}
    steps:
      - name: Nur grün getesteten Stand ausrollen (production nur von main)
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_ENV: ${{ inputs.environment || 'production' }}
        run: |
          case "${GITHUB_REF}" in
            (refs/heads/*) BRANCH="${GITHUB_REF#refs/heads/}" ;;
            (*) echo "Deploy nur von einem Branch (gestartet von ${GITHUB_REF})."; exit 1 ;;
          esac
          # Branchname landet in einem SSH-Kommando: nur unverdächtige Zeichen.
          case "$BRANCH" in (*[!A-Za-z0-9._/-]*|'') echo "Ungültiger Branchname: $BRANCH"; exit 1;; esac
          case "$TARGET_ENV" in
            (production)
              if [ "$BRANCH" != "main" ]; then
                echo "Production nur von main (gestartet von ${GITHUB_REF})."; exit 1
              fi
              SHA=$(gh api "repos/$REPO/commits/main" --jq .sha) ;;
            (staging)
              SHA="${GITHUB_SHA}" ;;
            (*) echo "Unbekannte Umgebung: $TARGET_ENV"; exit 1 ;;
          esac
          RESULT=$(gh run list --repo "$REPO" --workflow tests.yml --branch "$BRANCH" --commit "$SHA" --json conclusion --jq '.[0].conclusion // "keiner"')
          if [ "$RESULT" != "success" ]; then
            echo "Tests für $SHA ($BRANCH): $RESULT -- Deploy abgebrochen."; exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Geprüften Commit auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Assets bauen
        env:
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f public/build/manifest.json
          # deploy.sh übernimmt den Build nur für genau diesen Commit.
          printf '%s\n' "$SHA" > public/build/build-sha.txt

      - name: Build als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: public-build
          path: public/build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: [verify, build]
    runs-on: ubuntu-latest
    # Wählt die GitHub-Umgebung und damit deren Secrets (DEPLOY_*).
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - name: Build-Artefakt holen
        uses: actions/download-artifact@v4
        with:
          name: public-build
          path: build

      - name: SSH vorbereiten
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy ausführen
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          APP_PATH: ${{ secrets.DEPLOY_PATH }}
          SHA: ${{ needs.verify.outputs.sha }}
          BRANCH: ${{ needs.verify.outputs.branch }}
          WITH_CONTENT: ${{ inputs.with_content && '--with-content' || '' }}
        run: |
          case "$SHA" in (*[!0-9a-f]*|'') echo "Ungültiger Commit"; exit 1;; esac
          case "$BRANCH" in (*[!A-Za-z0-9._/-]*|'') echo "Ungültiger Branch"; exit 1;; esac
          test "$(tr -d '[:space:]' < build/build-sha.txt)" = "$SHA"
          SSH_OPTS=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes)
          # Temporäres Verzeichnis auf dem Server für den fertigen Build.
          REMOTE_TMP=$(ssh "${SSH_OPTS[@]}" "$USER@$HOST" 'mktemp -d "${TMPDIR:-/tmp}/boatingschool-build.XXXXXX"')
          case "$REMOTE_TMP" in (/*boatingschool-build.*) ;; (*) echo "Unerwartetes Temp-Verzeichnis: $REMOTE_TMP"; exit 1;; esac
          scp -q -r "${SSH_OPTS[@]}" build "$USER@$HOST:$REMOTE_TMP/"
          ssh "${SSH_OPTS[@]}" "$USER@$HOST" \
            "cd '$APP_PATH' && BUILD_DIR='$REMOTE_TMP/build' ./deploy/deploy.sh '$BRANCH' '$SHA' $WITH_CONTENT; rc=\$?; rm -rf '$REMOTE_TMP'; exit \$rc"
