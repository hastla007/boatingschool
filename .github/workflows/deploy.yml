name: Deploy

# Deploy per Knopfdruck (Actions → Deploy → Run workflow). Läuft nie
# automatisch. Führt auf dem Server deploy/deploy.sh aus.
#
# Benötigte Repository-Secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST         Hostname oder IP des Servers
#   DEPLOY_USER         SSH-Benutzer (Deploy-Benutzer, nicht root)
#   DEPLOY_SSH_KEY      privater SSH-Schlüssel (nur für diesen Zweck erzeugen)
#   DEPLOY_KNOWN_HOSTS  Ausgabe von `ssh-keyscan <host>` (schützt vor fremden Servern)
#   DEPLOY_PATH         App-Verzeichnis, z. B. /var/www/boatingschool

#
# Ausgerollt wird nur `main`, und nur ein Stand, für den der Workflow
# „Tests“ grün ist. Der geprüfte Commit wird an deploy.sh übergeben, damit
# genau dieser Stand auf den Server kommt (auch wenn main inzwischen weiter ist).

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Nur grün getesteten Stand von main ausrollen
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Deploy nur von main (gestartet von ${GITHUB_REF})."; exit 1
          fi
          SHA=$(gh api "repos/$REPO/commits/main" --jq .sha)
          RESULT=$(gh run list --repo "$REPO" --workflow tests.yml --branch main --commit "$SHA" --json conclusion --jq '.[0].conclusion // "keiner"')
          if [ "$RESULT" != "success" ]; then
            echo "Tests für $SHA: $RESULT -- Deploy abgebrochen."; exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: SSH vorbereiten
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy ausführen
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          APP_PATH: ${{ secrets.DEPLOY_PATH }}
          SHA: ${{ steps.verified.outputs.sha }}
        run: |
          case "$SHA" in (*[!0-9a-f]*|'') echo "Ungültiger Commit"; exit 1;; esac
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "cd '$APP_PATH' && ./deploy/deploy.sh main '$SHA'"
