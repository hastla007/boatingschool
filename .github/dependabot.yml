# Abhängigkeits-Updates (Betriebsaudit OPS-7): wöchentliche Pull-Requests für
# PHP-, JS-Pakete und GitHub-Actions; Sicherheitsupdates kommen sofort.
# Major-Sprünge (z. B. Laravel 13, Vite 7) bewusst einzeln prüfen.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      composer-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Tailwind 4 braucht eine Konfig-Migration, Umbenennungen in rund 190
      # Blade-Dateien und neue Browser-Mindestversionen (Safari 16.4+).
      # Pausiert bis zur Entscheidung (siehe #86).
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
