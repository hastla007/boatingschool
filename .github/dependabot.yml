# Abhängigkeits-Updates (Betriebsaudit OPS-7): wöchentliche Pull-Requests für
# PHP-, JS-Pakete und GitHub-Actions; Sicherheitsupdates kommen sofort.
# Major-Sprünge (z. B. Laravel 13, Vite 7) bewusst einzeln prüfen.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      composer-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
