":"spoken","channel":16},"speech":true}]},{"key":"sicherheit","unit":"Dringlichkeit und Sicherheit","title":"Sicherheitsmeldung (SECURITE)","pruefung":"4.b","intro":"Um 13:10 UTC sichtest du einen treibenden Container auf Position 54\u00b012'N 007\u00b045'E, eine Gefahr f\u00fcr die Schifffahrt. K\u00fcndige die Sicherheitsmeldung per DSC an alle an und sprich sie auf Kanal 16.","start":{"utc":"13:10","position":[54,10,"N",7,52,"E"],"power":true,"vol":5,"sql":3,"channel":16},"steps":[{"text":"Sende einen DSC-Anruf an alle Funkstellen mit der Kategorie \u201eSafety\u201c.","target":"menu","help":"MENU, \u201eAll Ships Call\u201c, \u201eSafety\u201c, ENTER zum Senden.","goal":{"type":"dsc_sent","kind":"all_ships","category":"Safety"},"speech":false},{"text":"Sprich die Sicherheitsmeldung auf Kanal 16.","target":"ptt","help":"SECURITE (dreimal), all stations (dreimal), this is Kormoran (dreimal), DH4721, MMSI 211472100, navigational warning, drifting container in position \u2026 at 1310 UTC, danger to navigation, out.","goal":{"type":"spoken","channel":16},"speech":true}]},{"key":"dringlichkeit-empfangen","unit":"Dringlichkeit und Sicherheit","title":"Dringlichkeit und Sicherheit empfangen","intro":"Du arbeitest auf Kanal 72. Bremen Rescue k\u00fcndigt per DSC eine Dringlichkeitsmeldung an alle an. Geh auf Kanal 16 und h\u00f6r sie mit.","start":{"channel":72,"position":[54,10,"N",7,52,"E"],"utc":"12:30","power":true,"vol":5,"sql":3},"steps":[{"text":"Warte auf den Anruf und schalte den Alarmton aus.","target":"clr","help":"Bei \u201eReceived All Ships\u201c: CLR dr\u00fccken.","goal":{"type":"alarm_stopped","call":"all_ships"},"receive":{"delay_ms":1500,"call":{"type":"all_ships","from":{"name":"BREMEN RESCUE","mmsi":"002111240"},"category":"Urgency","channel":16}},"speech":false},{"text":"Geh auf den angek\u00fcndigten Kanal 16.","target":"enter","help":"ENTER dr\u00fccken: Das Ger\u00e4t schaltet auf Kanal 16.","goal":{"type":"call_accepted","channel":16},"speech":f ort der Schleuse.","target":null,"help":"Nur zuh\u00f6ren.","goal":{"type":"voice","heard":true,"from":"SCHLEUSE"},"voice":{"delay_ms":2000,"from":"SCHLEUSE","channel":20,"lang":"de-DE","text":"Kormoran, hier Schleuse. Einfahrt in etwa zehn Minuten, achten Sie auf das gr\u00fcne Licht. Ende."},"speech":false}]},{"catalog":"UBI","lang":"de-DE","key":"binnen-begegnung","unit":"Binnen: Funkverkehr","title":"Begegnung absprechen","intro":"Du f\u00e4hrst auf dem Rhein bei Kilometer 848 zu Berg und h\u00e4ltst dich am linken Ufer. Vor dir kommt das Motorschiff Hansestadt zu Tal. Sprich die Begegnung auf Kanal 10 ab.","start":{"power":true,"vol":5,"sql":3,"group":"ATIS","channel":10,"highPower":false},"steps":[{"text":"Ruf die Hansestadt auf Kanal 10.","target":"ptt","help":"\u201eHansestadt, Hansestadt, hier ist Kormoran, Kormoran, Delta Hotel Vier Sieben Zwo Eins, ich bin Bergfahrer, ich halte mich am linken Ufer, Begegnung Backbord an Backbord, kommen.\u201c","goal":{"type":"spoken","channel":10,"group":"ATIS"},"speech":true},{"text":"H\u00f6r die Antwort.","target":null,"help":"Nur zuh\u00f6ren.","goal":{"type":"voice","heard":true,"from":"HANSESTADT"},"voice":{"delay_ms":2000,"from":"HANSESTADT","channel":10,"lang":"de-DE","text":"Kormoran, hier Hansestadt. Begegnung Backbord an Backbord, verstanden. Ende."},"speech":false}]},{"catalog":"UBI","lang":"de-DE","key":"binnen-privat","unit":"Binnen: Funkverkehr","title":"Gespr\u00e4ch privater Art","intro":"Gespr\u00e4che privater Art geh\u00f6ren nicht auf Kanal 10, sondern auf die Kan\u00e4le 72 oder 77 im Verkehrskreis Schiff-Schiff.","start":{"power":true,"vol":5,"sql":3,"group":"ATIS","channel":10,"highPower":false},"steps":[{"text":"H\u00f6r zu: Die M\u00f6we ruft dich auf Kanal 10.","target":null,"help":"Nur zuh\u00f6ren.","goal":{"type":"voice","heard":true,"from":"MOEWE"},"voice":{"delay_ms":1500,"from":"MOEWE","channel":10,"lang":"de-DE","text":"Kormoran, Kormoran, hier M\u00f6we, M\u00f6we. F\u00fcr ein privates
