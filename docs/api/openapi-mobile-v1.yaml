      responses:
        '200': {description: Bewertung und Musterlösung}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/texts/{textId}/done:
    put:
      tags: [Radio]
      operationId: setRadioTextDone
      summary: Seefunktext erledigt markieren
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {$ref: '#/components/parameters/CourseId'}
        - {in: path, name: textId, required: true, schema: {type: string, maxLength: 40}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [done], properties: {done: {type: boolean}}}
      responses:
        '200': {description: Gespeicherter Status}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/vocabulary:
    get:
      tags: [Radio]
      operationId: listRadioVocabulary
      summary: Vokabelkarten nach Katalog und Kategorie
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {$ref: '#/components/parameters/CourseId'}
        - {in: query, name: catalog, schema: {type: string, enum: [SRC, UBI]}}
        - {in: query, name: category, schema: {type: string, maxLength: 191}}
      responses:
        '200': {description: Vokabelkarten und Lernstand}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/vocabulary/{cardId}/answers:
    post:
      tags: [Radio]
      operationId: answerRadioVocabulary
      summary: Vokabel als gewusst/nicht gewusst bewerten
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {$ref: '#/components/parameters/CourseId'}
        - {in: path, name: cardId, required: true, schema: {type: string, maxLength: 40}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [known], properties: {known: {type: boolean}, streak: {type: [integer, 'null'], minimum: 0}}}
      responses:
        '200': {description: Aktualisierter Lernstand}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/practice:
    get:
      tags: [Radio]
      operationId: listRadioPractice
      summary: Funkpraxis-Aufgaben je Katalog
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {$ref: '#/components/parameters/CourseId'}
      responses:
        '200': {description: Aufgabenlisten und Fortschritt}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/practice/{scenarioId}:
    get:
      tags: [Radio]
      operationId: getRadioPractice
      summary: Funkpraxis-Aufgabe ohne Musterlösung
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {$ref: '#/components/parameters/CourseId'}
        - {in: path, name: scenarioId, required: true, schema: {type: string, maxLength: 40}}
      responses:
        '200': {description: Aufgabe und gespeicherte Antworten}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/practice/{scenarioId}/evaluate:
    post:
      tags: [Radio]
      operationId: evaluateRadioPractice
      summary: Funkpraxis-Antworten auswerten
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {$ref: '#/components/parameters/CourseId'}
        - {in: path, name: scenarioId, required: true, schema: {type: string, maxLength: 40}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [answers], properties: {answers: {type: object, additionalProperties: {type: [string, 'null'], maxLength: 5000}}}}
      responses:
        '200': {description: Prüfpunkte und Musterlösungen}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/practice/{scenarioId}/done:
    put:
      tags: [Radio]
      operationId: setRadioPracticeDone
      summary: Funkpraxis-Aufgabe erledigt markieren
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {$ref: '#/components/parameters/CourseId'}
        - {in: path, name: scenarioId, required: true, schema: {type: string, maxLength: 40}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [done], properties: {done: {type: boolean}}}
      responses:
        '200': {description: Gespeicherter Status}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/samples:
    get:
      tags: [Radio]
      operationId: listRadioSamples
      summary: Musterlösungen der Funkpraxis
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {$ref: '#/components/parameters/CourseId'}
      responses:
        '200': {description: Musterlösungen nach Katalog}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  /courses/{courseId}/videos:
    get:
      tags: [Videos]
      operationId: listVideoModules
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/CourseId'}]
      responses:
        '200':
          description: Kapitel mit Lektionen
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/VideoModule'}}
        '403': {$ref: '#/components/responses/Problem'}
  /videos/{lessonId}:
    get:
      tags: [Videos]
      operationId: getVideoLesson
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/LessonId'}]
      responses:
        '200':
          description: Lektion mit Schritt-Galerie
          content:
            application/json:
              schema:
                type: object
                properties: {data: {$ref: '#/components/schemas/VideoLesson'}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /videos/{lessonId}/progress:
    put:
      tags: [Videos]
      operationId: updateVideoProgress
      summary: Wiedergabestand speichern (abgeschlossen bleibt abgeschlossen)
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/LessonId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position_seconds, completed]
              properties:
                position_seconds: {type: integer, minimum: 0, maximum: 86400}
                completed: {type: boolean}
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lesson_id: {type: string}
                      position_seconds: {type: integer}
                      completed: {type: boolean}
                      updated_at: {type: string, format: date-time}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  # --------------------------------------------------------- Navigation
  /courses/{courseId}/navigation-tasks:
    get:
      tags: [Navigation]
      operationId: listNavigationTasks
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {$ref: '#/components/parameters/CourseId'}
        - {$ref: '#/components/parameters/Page'}
        - {in: query, name: per_page, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Aufgaben mit eigenem Stand
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/NavigationTaskSummary'}}
                  meta: {type: object, properties: {pagination: {$ref: '#/components/schemas/Pagination'}}}
        '403': {$ref: '#/components/responses/Problem'}
  /navigation-tasks/{taskId}:
    get:
      tags: [Navigation]
      operationId: getNavigationTask
      description: Musterlösungen nur mit `show_solution=true`. Gesperrt (409 NAVIGATION_TASK_IN_EXAM), solange die Aufgabe Teil einer laufenden Prüfung ist.
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {$ref: '#/components/parameters/TaskId'}
        - {in: query, name: show_solution, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: Aufgabe
          content:
            application/json:
              schema:
                type: object
                properties: {data: {$ref: '#/components/schemas/NavigationTask'}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /navigation-tasks/{taskId}/parts/{partId}/answer:
    put:
      tags: [Navigation]
      operationId: answerNavigationPart
      summary: Eigene Antwort prüfen (Toleranz bei Messwerten) oder Selbstbewertung speichern
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {$ref: '#/components/parameters/TaskId'}
        - {in: path, name: partId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Genau eines von beiden.
              properties:
                answer: {type: string, maxLength: 500}
                self_assessment: {type: string, enum: [correct, incorrect]}
      responses:
        '200':
          description: Bewertet
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      part_id: {type: string}
                      own_answer: {type: [string, 'null']}
                      auto_checked: {type: boolean}
                      correct: {type: [boolean, 'null'], description: 'null = nicht automatisch prüfbar, bitte selbst bewerten'}
                      solution: {type: string}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /navigation-tasks/{taskId}/parts/{partId}:
    post:
      tags: [Navigation]
      operationId: answerNavigationPartCompatible
      summary: WP-kompatible Antwort und dreistufige Selbsteinschätzung speichern
      description: |
        Alias des Laravel-PUT-Endpunkts mit dem Pfad und Antwortformat der WP-App.
        `self_assessment` akzeptiert `correct`, `partly` oder `wrong`; eine fehlende
        Antwort oder Bewertung lässt den jeweils gespeicherten Wert unverändert. Ein leerer
        Antworttext löscht die eigene Antwort. Die automatische Prüfung verwendet die im
        Laravel-Navigationsinhalt vorhandene Musterlösung.
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {$ref: '#/components/parameters/TaskId'}
        - {in: path, name: partId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                answer: {type: [string, 'null'], maxLength: 5000}
                self_assessment: {type: [string, 'null'], enum: [correct, partly, wrong, null]}
      responses:
        '200':
          description: Antwort gespeichert
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [part_id, solution, my_answer, self_assessment, done, auto_check, check]
                    properties:
                      part_id: {type: string, format: uuid}
                      solution: {type: string}
                      my_answer: {type: [string, 'null']}
                      self_assessment: {type: [string, 'null'], enum: [correct, partly, wrong, null]}
                      done: {type: boolean}
                      auto_check: {type: boolean}
                      check:
                        oneOf:
                          - {type: 'null'}
                          - type: object
                            required: [status, message, values]
                            properties:
                              status: {type: string, enum: [within, deviates]}
                              message: {type: string}
                              values: {type: array, items: {type: object}}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  # ------------------------------------------------------------ Coupons
  /coupons/redeem:
    post:
      tags: [Coupons]
      operationId: redeemCoupon
      summary: Zugangscode einlösen (nach dem Kauf im externen Webshop)
      description: |
        Unbekannte, gesperrte, abgelaufene und von anderen eingelöste Codes ergeben einheitlich
        422 `COUPON_INVALID`. Ein vom eigenen Konto in dieser Schule schon eingelöster Code
        liefert das Ergebnis erneut (`already_redeemed: true`). Danach `GET /courses` neu laden.
        Begrenzung 10 Versuche pro Minute.
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: {code: {type: string, minLength: 4, maxLength: 100}}
      responses:
        '200':
          description: Eingelöst
          content:
            application/json:
              schema:
                type: object
                properties: {data: {$ref: '#/components/schemas/CouponRedemption'}}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}

  # ------------------------------------------------------------ Privacy
  /profile/export:
    post:
      tags: [Privacy]
      operationId: requestDataExport
      summary: DSGVO-Datenexport anfordern (Daten bei dieser Schule)
      description: Wird sofort erzeugt (`status = ready`, bei einem Fehler `failed`) und ist 60 Minuten abrufbar; danach wird die Datei gelöscht (stündliches Aufräumen). Höchstens 5 Anforderungen pro Stunde. Ohne Idempotency-Key -- ein erneuter Aufruf liefert einen frischen Export.
      parameters: [{$ref: '#/components/parameters/TenantSlug'}]
      responses:
        '202':
          description: Export angelegt
          content:
            application/json:
              schema:
                type: object
                properties: {data: {$ref: '#/components/schemas/ExportStatus'}}
        '429': {$ref: '#/components/responses/Problem'}
  /profile/export/{exportId}:
    get:
      tags: [Privacy]
      operationId: getDataExport
      summary: Status und kurzlebiger Download-Link (10 Minuten)
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {in: path, name: exportId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties: {data: {$ref: '#/components/schemas/ExportStatus'}}
        '404': {$ref: '#/components/responses/Problem'}
  /profile/export/{exportId}/download:
    get:
      tags: [Privacy]
      operationId: downloadDataExport
      summary: JSON-Datei herunterladen (signierter Link aus `download_url`, ohne Token)
      security: []
      parameters:
        - {in: path, name: exportId, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: tenant, required: true, schema: {type: string}}
        - {in: query, name: expires, required: true, schema: {type: integer}}
        - {in: query, name: signature, required: true, schema: {type: string}}
      responses:
        '200':
          description: Datei
          content:
            application/json: {schema: {type: object}}
        '403': {description: 'LINK_INVALID: Signatur falsch oder Link abgelaufen', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '410': {$ref: '#/components/responses/Problem'}

  /tips:
    get:
      tags: [Tips]
      operationId: listTips
      summary: Veröffentlichte Tipps und Tricks
      description: Liefert die aktiven, plattformweiten Tipps gruppiert nach Kategorie. Ein Kurszugang ist nicht erforderlich; der angemeldete Tenant-Kontext bleibt erforderlich. HTML wird serverseitig bereinigt, relative Links und Bildpfade werden absolut ausgegeben.
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
      responses:
        '200':
          description: Tipps nach Kategorie
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TipsResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/praxis:
    get:
      tags: [Praxis]
      operationId: listPraxisCards
      summary: Praxiskarten nach Kategorien
      description: Liefert aktive Praxiskarten und den persönlichen Status. Karten, deren Unterkategorie bereits die Lösung verrät, erhalten vorab keinen Titel.
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {$ref: '#/components/parameters/CourseId'}
      responses:
        '200':
          description: Kategorien und Lernstand
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [name, known_count, cards]
                      properties:
                        name: {type: string}
                        known_count: {type: integer}
                        cards:
                          type: array
                          items:
                            type: object
                            required: [id, title, locked, media, status]
                            properties:
                              id: {type: string, format: uuid}
                              title: {type: [string, 'null']}
                              locked: {type: boolean}
                              reference: {type: [string, 'null']}
                              type: {type: [string, 'null']}
                              question: {type: [string, 'null']}
                              answer: {type: [string, 'null']}
                              explanation: {type: [string, 'null']}
                              media: {type: array, items: {$ref: '#/components/schemas/Media'}}
                              source: {type: [string, 'null']}
                              source_url: {type: [string, 'null']}
                              status: {type: string, enum: [known, practice, open]}
                  meta:
                    type: object
                    required: [total, known]
                    properties:
                      total: {type: integer}
                      known: {type: integer}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/praxis/{cardId}:
    put:
      tags: [Praxis]
      operationId: setPraxisStatus
      summary: Status einer Praxiskarte setzen
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {$ref: '#/components/parameters/CourseId'}
        - in: path
          name: cardId
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [known, practice, open]}
      responses:
        '200':
          description: Gespeicherter Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [card_id, status]
                    properties:
                      card_id: {type: string, format: uuid}
                      status: {type: string, enum: [known, practice, open]}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/exam-registration:
    get:
      tags: [Courses]
      operationId: getExamRegistrationGuide
      summary: Prüfungsanmeldung und Prüfungsausschüsse
      description: Liefert die native Prüfungsanleitung des Kurses. Die App bucht keinen Termin; die Anmeldung erfolgt beim DSV/DMYV. Ein aktiver Kurszugang ist nicht erforderlich.
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {$ref: '#/components/parameters/CourseId'}
      responses:
        '200':
          description: Prüfungsanleitung
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [course_id, web_url, registration_in_app, guides, committees]
                    properties:
                      course_id: {type: string, format: uuid}
                      web_url: {type: string, format: uri}
                      registration_in_app: {type: boolean, const: false}
                      guides:
                        type: array
                        items:
                          type: object
                          required: [key, tab, title, variants, exam_parts, faq, providers]
                          additionalProperties: true
                          properties:
                            key: {type: string}
                            tab: {type: string}
                            title: {type: string}
                            intro: {type: [string, 'null']}
                            fee: {type: [string, 'null']}
                            fee_note: {type: [string, 'null']}
                            lead_time: {type: [string, 'null']}
                            min_age: {type: [string, 'null']}
                            apply: {type: [string, 'null']}
                            deadline: {type: [string, 'null']}
                            documents: {type: array, items: {type: string}}
                            variants: {type: array, items: {type: object, additionalProperties: true}}
                            exam_parts: {type: array, items: {type: object, additionalProperties: true}}
                            faq: {type: object, additionalProperties: {type: string}}
                            providers: {type: array, items: {type: object, additionalProperties: true}}
                      committees:
                        type: array
                        description: Allgemeine DSV/DMYV-Kontakte aus der nativen Prüfungsanleitung.
                        items:
                          type: object
                          required: [id, label, commission, matches]
                          additionalProperties: true
                          properties:
                            id: {type: string}
                            label: {type: string}
                            commission: {type: string}
                            website: {type: [string, 'null'], format: uri}
                            matches: {type: boolean}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/faqs:
    get:
      tags: [Courses]
      operationId: listCourseFaqs
      summary: Veröffentliche Kunden-FAQs nach Kurs und Unterkategorie
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/CourseId'}]
      responses:
        '200':
          description: Gruppierte Kunden-FAQs
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/CourseFaqGroup'}
                  meta:
                    type: object
                    required: [course_id, groups, faqs]
                    properties:
                      course_id: {type: string, format: uuid}
                      groups: {type: integer}
                      faqs: {type: integer}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Undurchsichtiges Access-Token (`bsa_…`), 15 Minuten gültig.
  parameters:
    TenantSlug:
      in: header
      name: X-Tenant-Slug
      required: true
      description: Kennung der Schule aus `memberships[].tenant_slug`.
      schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,119}$'}
    TenantSlugOptional:
      in: header
      name: X-Tenant-Slug
      required: false
      schema: {type: string}
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: UUID je fachlicher Aktion; Wiederholung liefert die gespeicherte Antwort, anderer Inhalt → 409 IDEMPOTENCY_KEY_REUSED.
      schema: {type: string, format: uuid}
    Page: {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
    PerPage: {in: query, name: per_page, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    CourseId: {in: path, name: courseId, required: true, schema: {type: string, format: uuid}}
    CollectionId: {in: path, name: collectionId, required: true, schema: {type: string, format: uuid}}
    QuestionId: {in: path, name: questionId, required: true, schema: {type: string, format: uuid}}
    AttemptId: {in: path, name: attemptId, required: true, schema: {type: string, format: uuid}}
    ExamId: {in: path, name: examId, required: true, schema: {type: string, format: uuid}}
    LessonId: {in: path, name: lessonId, required: true, schema: {type: string, format: uuid}}
    TaskId: {in: path, name: taskId, required: true, schema: {type: string, format: uuid}}
    SessionId: {in: path, name: sessionId, required: true, schema: {type: string, format: uuid}}
  responses:
    Problem:
      description: Fehler
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Accepted:
      description: Angenommen
      content:
        application/json:
          schema:
            type: object
            properties:
              data: {type: object, properties: {status: {type: string, const: accepted}}}
  schemas:
    Problem:
      type: object
      required: [title, status, code, request_id]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code:
          type: string
          description: Stabiler Fehlercode, siehe docs/api/README.md
          enum: [UNAUTHENTICATED, TWO_FACTOR_INVALID, VALIDATION_FAILED, RATE_LIMITED, FORBIDDEN, RESOURCE_NOT_FOUND, CONFLICT, GONE,
            METHOD_NOT_ALLOWED, SERVER_ERROR, SERVICE_UNAVAILABLE, REQUEST_FAILED,
            EMAIL_NOT_VERIFIED, TENANT_MEMBERSHIP_REQUIRED, TENANT_MEMBERSHIP_SUSPENDED, TENANT_UNAVAILABLE,
            ENTITLEMENT_REQUIRED, ENTITLEMENT_EXPIRED, PASSWORD_RESET_INVALID_OR_EXPIRED, IDEMPOTENCY_KEY_REUSED,
            COLLECTION_NOT_DELETABLE, EXAM_NOT_AVAILABLE, EXAM_ANSWER_LOCKED, EXAM_ALREADY_SUBMITTED, EXAM_EXPIRED,
            EXAM_NOT_SUBMITTED, EXAM_NO_NAVIGATION_PART, EXAM_NAVIGATION_ALREADY_SUBMITTED, EXAM_NAVIGATION_NOT_SUBMITTED,
            NAVIGATION_TASK_IN_EXAM, COUPON_INVALID, COUPON_NOT_APPLICABLE, EXPORT_EXPIRED,
            MAINTENANCE, APP_UPDATE_REQUIRED, EXAM_QUESTIONS_OPEN, EXAM_QUESTION_LOCKED, LINK_INVALID]
        errors: {type: object, additionalProperties: {type: array, items: {type: string}}}
        request_id: {type: string}
        exam_id: {type: string, description: Bei NAVIGATION_TASK_IN_EXAM}
        minimum_version: {type: string, description: Bei APP_UPDATE_REQUIRED}
        store_url: {type: [string, 'null'], description: Bei APP_UPDATE_REQUIRED}
    LoginRequest:
      type: object
      required: [email, password, device_name]
      properties:
        email: {type: string, format: email}
        password: {type: string}
        device_name: {type: string, maxLength: 100}
        device_platform: {type: string, enum: [ios, android]}
        app_version: {type: string, maxLength: 40}
    TokenPair:
      type: object
      required: [access_token, token_type, access_expires_at, refresh_token, refresh_expires_at, session_id]
      properties:
        access_token: {type: string}
        token_type: {type: string, const: Bearer}
        access_expires_at: {type: string, format: date-time}
        refresh_token: {type: string}
        refresh_expires_at: {type: string, format: date-time}
        session_id: {type: string}
    LoginResult:
      allOf:
        - {$ref: '#/components/schemas/TokenPair'}
        - type: object
          properties:
            user: {$ref: '#/components/schemas/User'}
            memberships: {type: array, items: {$ref: '#/components/schemas/Membership'}}
    TwoFactorChallenge:
      type: object
      required: [two_factor_required, challenge_token, challenge_expires_at]
      properties:
        two_factor_required: {type: boolean, const: true}
        challenge_token: {type: string}
        challenge_expires_at: {type: string, format: date-time}
    User:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        first_name: {type: [string, 'null']}
        last_name: {type: [string, 'null']}
        email: {type: string, format: email}
        email_verified: {type: boolean}
        two_factor_enabled: {type: boolean}
    Membership:
      type: object
      properties:
        tenant_slug: {type: string}
        tenant_name: {type: string}
        status: {type: string, enum: [active, suspended]}
