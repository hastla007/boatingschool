                      type: object
                      properties:
                        catalog: {$ref: '#/components/schemas/RadioCatalog'}
                        tasks:
                          type: array
                          items:
                            type: object
                            properties:
                              id: {type: string}
                              number: {type: integer}
                              kind: {type: string}
                              fields: {type: array, items: {type: object, properties: {name: {type: string}, label: {type: [string, 'null']}, solution: {type: string}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  # ------------------------------------------------------------ Coupons
  /files/{fileId}:
    get:
      tags: [Files]
      operationId: downloadFile
      summary: Kursdatei oder Fragenbild herunterladen (Zugang je Datei geprüft)
      description: |
        `fileId` stammt aus `url` einer Kursdatei (Kursdetail) bzw. aus `file_id`/`download_url` eines
        Fragenbilds. Token und `X-Tenant-Slug` sind nötig; die Prüfung gilt für die angegebene Schule.

        * Kategorie download: Funktion `downloads` (voller Kurszugang, Zugang mit Capability `downloads`
          oder Schulregel; Probezugang = die ersten N Downloads in Kursreihenfolge).
        * Andere Dateien mit `required_capability`: diese Funktion; ohne: voller Kurszugang.
        * Fragenbilder: Frage im freigegebenen Fragenkatalog oder Prüfungszugang im Kurs; sonst 404.

        PDFs, Bilder, Audio/Video und Text kommen `inline`, alle anderen Typen als
        `application/octet-stream`-Anhang. Ein einzelner Range-Bereich wird unterstützt (206).
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {in: path, name: fileId, required: true, schema: {type: string, format: uuid}}
        - {in: header, name: Range, required: false, schema: {type: string, examples: ['bytes=1048576-']}}
      responses:
        '200': {description: Datei, content: {application/octet-stream: {schema: {type: string, contentMediaType: application/octet-stream}}}}
        '206': {description: 'Teilbereich (Content-Range: Start, Ende, Dateigröße)', content: {application/octet-stream: {schema: {type: string, contentMediaType: application/octet-stream}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '416': {description: Bereich ungültig}
  /coupons/redeem:
    post:
      tags: [Coupons]
      operationId: redeemCoupon
      summary: Zugangscode einlösen (nach dem Kauf im externen Webshop)
      description: |
        Unbekannte, gesperrte, abgelaufene und von anderen eingelöste Codes ergeben einheitlich
        422 `COUPON_INVALID`. Ein vom eigenen Konto in dieser Schule schon eingelöster Code
        liefert das Ergebnis erneut (`already_redeemed: true`). Danach `GET /courses` neu laden.
        Begrenzung 10 Versuche pro Minute.
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: {code: {type: string, minLength: 4, maxLength: 100}}
      responses:
        '200':
          description: Eingelöst
          content:
            application/json:
              schema:
                type: object
                properties: {data: {$ref: '#/components/schemas/CouponRedemption'}}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}

  # ------------------------------------------------------------ Privacy
  /profile/export:
    post:
      tags: [Privacy]
      operationId: requestDataExport
      summary: DSGVO-Datenexport anfordern (Daten bei dieser Schule)
      description: Wird sofort erzeugt (`status = ready`, bei einem Fehler `failed`) und ist 60 Minuten abrufbar; danach wird die Datei gelöscht (stündliches Aufräumen). Höchstens 5 Anforderungen pro Stunde. Ohne Idempotency-Key -- ein erneuter Aufruf liefert einen frischen Export.
      parameters: [{$ref: '#/components/parameters/TenantSlug'}]
      responses:
        '202':
          description: Export angelegt
          content:
            application/json:
              schema:
                type: object
                properties: {data: {$ref: '#/components/schemas/ExportStatus'}}
        '429': {$ref: '#/components/responses/Problem'}
  /profile/export/{exportId}:
    get:
      tags: [Privacy]
      operationId: getDataExport
      summary: Status und kurzlebiger Download-Link (10 Minuten)
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {in: path, name: exportId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties: {data: {$ref: '#/components/schemas/ExportStatus'}}
        '404': {$ref: '#/components/responses/Problem'}
  /profile/export/{exportId}/download:
    get:
      tags: [Privacy]
      operationId: downloadDataExport
      summary: JSON-Datei herunterladen (signierter Link aus `download_url`, ohne Token)
      security: []
      parameters:
        - {in: path, name: exportId, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: tenant, required: true, schema: {type: string}}
        - {in: query, name: expires, required: true, schema: {type: integer}}
        - {in: query, name: signature, required: true, schema: {type: string}}
      responses:
        '200':
          description: Datei
          content:
            application/json: {schema: {type: object}}
        '403': {description: 'LINK_INVALID: Signatur falsch oder Link abgelaufen', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '410': {$ref: '#/components/responses/Problem'}

  # -------------------------------------------------------- Tipps & FAQ
  /tips:
    get:
      tags: [Tips]
      operationId: listTips
      summary: Aktive Tipps und Tricks nach Kategorie
      description: Plattformweite Tipps (wie in der Web-App), gruppiert nach Kategorie; leere Kategorien entfallen. Kein Kurszugang nötig, aber Schulkontext (`X-Tenant-Slug`). HTML wird serverseitig bereinigt, relative Links werden absolut, Bilder nur mit http(s)-Quelle.
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
      responses:
        '200':
          description: Tipps nach Kategorie
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TipsResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/faqs:
    get:
      tags: [Courses]
      operationId: listCourseFaqs
      summary: Veröffentlichte Kunden-FAQs eines Kurses nach Kategorie
      description: Plattformweite FAQs (Import per `mobile-api:import-faqs`), zugeordnet über den Kurscode; Kombikurse zeigen zusätzlich die FAQs der enthaltenen Kurse. Erfordert aktiven Kurszugang. Jede FAQ erscheint nur einmal.
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/CourseId'}]
      responses:
        '200':
          description: Gruppierte Kunden-FAQs
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/CourseFaqGroup'}
                  meta:
                    type: object
                    required: [course_id, groups, faqs]
                    properties:
                      course_id: {type: string, format: uuid}
                      groups: {type: integer}
                      faqs: {type: integer}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Undurchsichtiges Access-Token (`bsa_…`), 15 Minuten gültig.
  parameters:
    TenantSlug:
      in: header
      name: X-Tenant-Slug
      required: true
      description: Kennung der Schule aus `memberships[].tenant_slug`.
      schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,119}$'}
    TenantSlugOptional:
      in: header
      name: X-Tenant-Slug
      required: false
      schema: {type: string}
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: UUID je fachlicher Aktion; Wiederholung liefert die gespeicherte Antwort, anderer Inhalt → 409 IDEMPOTENCY_KEY_REUSED.
      schema: {type: string, format: uuid}
    Page: {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
    PerPage: {in: query, name: per_page, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    CourseId: {in: path, name: courseId, required: true, schema: {type: string, format: uuid}}
    CollectionId: {in: path, name: collectionId, required: true, schema: {type: string, format: uuid}}
    QuestionId: {in: path, name: questionId, required: true, schema: {type: string, format: uuid}}
    ExamQuestionRef:
      in: path
      name: questionId
      required: true
      description: Frage-ID (UUID) oder Position der Frage in der Prüfung (1-basiert, WP-kompatibel)
      schema: {type: string, pattern: '^([0-9]{1,4}|[0-9a-fA-F-]{36})$'}
    AttemptId: {in: path, name: attemptId, required: true, schema: {type: string, format: uuid}}
    ExamId: {in: path, name: examId, required: true, schema: {type: string, format: uuid}}
    LessonId: {in: path, name: lessonId, required: true, schema: {type: string, format: uuid}}
    TaskId: {in: path, name: taskId, required: true, schema: {type: string, format: uuid}}
    SessionId: {in: path, name: sessionId, required: true, schema: {type: string, format: uuid}}
    RadioTextId: {in: path, name: textId, required: true, description: 'z. B. TXT-SRC-01, UBI-AUF-01, UBI-ABG-01', schema: {type: string, pattern: '^[A-Za-z0-9-]{1,40}$'}}
    RadioScenarioId: {in: path, name: scenarioId, required: true, description: 'z. B. SRC-01, UBI-01', schema: {type: string, pattern: '^[A-Za-z0-9-]{1,40}$'}}
  requestBodies:
    RadioDone:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [done]
            properties: {done: {type: boolean}}
  responses:
    Problem:
      description: Fehler
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Accepted:
      description: Angenommen
      content:
        application/json:
          schema:
            type: object
            properties:
              data: {type: object, properties: {status: {type: string, const: accepted}}}
  schemas:
    Problem:
      type: object
      required: [title, status, code, request_id]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code:
          type: string
          description: Stabiler Fehlercode, siehe docs/api/README.md
          enum: [UNAUTHENTICATED, TWO_FACTOR_INVALID, VALIDATION_FAILED, RATE_LIMITED, FORBIDDEN, RESOURCE_NOT_FOUND, CONFLICT, GONE,
            METHOD_NOT_ALLOWED, SERVER_ERROR, SERVICE_UNAVAILABLE, REQUEST_FAILED,
            EMAIL_NOT_VERIFIED, TENANT_MEMBERSHIP_REQUIRED, TENANT_MEMBERSHIP_SUSPENDED, TENANT_UNAVAILABLE,
            ENTITLEMENT_REQUIRED, ENTITLEMENT_EXPIRED, PASSWORD_RESET_INVALID_OR_EXPIRED, IDEMPOTENCY_KEY_REUSED,
            COLLECTION_NOT_DELETABLE, EXAM_NOT_AVAILABLE, EXAM_ANSWER_LOCKED, EXAM_ALREADY_SUBMITTED, EXAM_EXPIRED,
            EXAM_NOT_SUBMITTED, EXAM_NO_NAVIGATION_PART, EXAM_NAVIGATION_ALREADY_SUBMITTED, EXAM_NAVIGATION_NOT_SUBMITTED,
            NAVIGATION_TASK_IN_EXAM, COUPON_INVALID, COUPON_NOT_APPLICABLE, EXPORT_EXPIRED,
            MAINTENANCE, APP_UPDATE_REQUIRED, EXAM_QUESTIONS_OPEN, EXAM_QUESTION_LOCKED, LINK_INVALID,
            WEB_SESSION_DISABLED, WEB_SESSION_NOT_ALLOWED, ACCOUNT_DELETION_NOT_ALLOWED, DELETION_CONFIRMATION_INVALID]
        errors: {type: object, additionalProperties: {type: array, items: {type: string}}}
        request_id: {type: string}
        exam_id: {type: string, description: Bei NAVIGATION_TASK_IN_EXAM}
        minimum_version: {type: string, description: Bei APP_UPDATE_REQUIRED}
        store_url: {type: [string, 'null'], description: Bei APP_UPDATE_REQUIRED}
    LoginRequest:
      type: object
      required: [email, password, device_name]
      properties:
        email: {type: string, format: email}
        password: {type: string}
        device_name: {type: string, maxLength: 100}
        device_platform: {type: string, enum: [ios, android]}
        app_version: {type: string, maxLength: 40}
    TokenPair:
      type: object
      required: [access_token, token_type, access_expires_at, refresh_token, refresh_expires_at, session_id]
      properties:
        access_token: {type: string}
        token_type: {type: string, const: Bearer}
        access_expires_at: {type: string, format: date-time}
        refresh_token: {type: string}
        refresh_expires_at: {type: string, format: date-time}
        session_id: {type: string}
    LoginResult:
      allOf:
        - {$ref: '#/components/schemas/TokenPair'}
        - type: object
          properties:
            user: {$ref: '#/components/schemas/User'}
            memberships: {type: array, items: {$ref: '#/components/schemas/Membership'}}
    TwoFactorChallenge:
      type: object
      required: [two_factor_required, challenge_token, challenge_expires_at]
      properties:
        two_factor_required: {type: boolean, const: true}
        challenge_token: {type: string}
        challenge_expires_at: {type: string, format: date-time}
    User:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        first_name: {type: [string, 'null']}
        last_name: {type: [string, 'null']}
        email: {type: string, format: email}
        email_verified: {type: boolean}
        two_factor_enabled: {type: boolean}
    Membership:
      type: object
      properties:
        tenant_slug: {type: string}
        tenant_name: {type: string}
        status: {type: string, enum: [active, suspended]}
        role: {type: string, const: learner}
        branding:
          type: object
          properties:
            logo_url: {type: [string, 'null'], format: uri}
            primary_color: {type: [string, 'null']}
            secondary_color: {type: [string, 'null']}
            support_email: {type: [string, 'null'], format: email}
        legal:
          type: object
          properties:
            imprint_url: {type: string, format: uri}
            privacy_url: {type: string, format: uri}
            account_url: {type: string, format: uri, description: 'Profil im Web (u. a. Konto löschen)'}
            data_rights_url: {type: string, format: uri, description: Datenrechte im Web}
    DeviceSession:
      type: object
      properties:
        id: {type: string}
        device_name: {type: string}
        device_platform: {type: [string, 'null']}
        app_version: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        last_used_at: {type: [string, 'null'], format: date-time}
        current: {type: boolean}
    Pagination:
      type: object
      properties:
        page: {type: integer}
        per_page: {type: integer}
        total: {type: integer}
        last_page: {type: integer}
    Entitlement:
      type: object
      description: >-
        Zugangsstand. `active` = mindestens eine Funktion voll nutzbar (gekauft,
        zugewiesen oder per Schulregel `free`), `limited` = nur Probezugang
        (Schulregel `free_limited`, siehe `limits`). Gültigkeit und Ablauf
        beziehen sich auf gekaufte/zugewiesene Zugänge.
      properties:
        status: {type: string, enum: [active, limited, pending, expired, suspended, revoked, not_granted]}
        valid_from: {type: [string, 'null'], format: date-time}
        valid_until: {type: [string, 'null'], format: date-time}
        trial: {type: boolean, description: 'Nur Probezugang (keine Funktion voll freigeschaltet)'}
        purchased: {type: boolean, description: 'Aktiver gekaufter/zugewiesener Zugang vorhanden'}
        limits:
          type: object
          description: 'Probezugang je Funktion -- die ersten N Einträge (z. B. Fragen je Modul)'
          additionalProperties: {type: integer, minimum: 1}
        expires_soon: {type: boolean, description: 'Fragenkatalog-Zugang läuft in den nächsten 14 Tagen ab'}
        expires_at: {type: [string, 'null'], format: date-time}
        renew_url: {type: [string, 'null'], format: uri, description: 'Verlängerungslink (nur bei expires_soon)'}
    FeatureAccess:
      type: object
      properties:
        available: {type: boolean, description: 'Funktion nutzbar (voll oder eingeschränkt)'}
        full: {type: boolean}
        limit: {type: [integer, 'null'], description: 'Bei eingeschränktem Zugang die ersten N Einträge'}
    CourseRelation:
      type: object
      description: 'Katalogregeln wie in der WP-App (Kombikurs gekauft blendet Teilkurse aus, Aufbaukurse werden empfohlen).'
      properties:
        hidden: {type: boolean}
        recommended: {type: boolean}
        recommended_for:
          type: array
          items: {type: object, properties: {id: {type: string}, name: {type: string}}}
    ProgressSummary:
      type: object
      description: completed = gefestigte Fragen (3× richtig in Folge, Regeln wie im Web)
      properties:
        percent: {type: integer, minimum: 0, maximum: 100}
        completed: {type: integer}
        total: {type: integer}
    CourseSummary:
      type: object
      properties:
        id: {type: string}
        code: {type: string}
        name: {type: string}
        description: {type: [string, 'null']}
        course_type: {type: string}
        access: {$ref: '#/components/schemas/Entitlement'}
        progress: {$ref: '#/components/schemas/ProgressSummary'}
        capabilities: {type: array, description: 'Funktionen, die der Kurs inhaltlich hat (downloads = veröffentlichte Kursdateien der Kategorie download)', items: {type: string, enum: [smarttrainer, favorites, exam, video, navigation, praxis, downloads]}}
        features:
          type: object
          description: 'Nutzbarkeit je Funktion für die angemeldete Person (Schlüssel wie capabilities ohne favorites, plus explanations)'
          additionalProperties: {$ref: '#/components/schemas/FeatureAccess'}
        webshop_url: {type: [string, 'null'], format: uri, description: 'Kauflink, solange kein voller Zugang besteht'}
        relation: {oneOf: [{$ref: '#/components/schemas/CourseRelation'}, {type: 'null'}]}
        last_activity_at: {type: [string, 'null'], format: date-time, description: Letzte Antwort in diesem Kurs}
    FileRef:
      type: object
      required: [id, title, locked, url, requires_authorization]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        description: {type: [string, 'null']}
        mime_type: {type: [string, 'null']}
        size_bytes: {type: [integer, 'null']}
        required_capability: {type: [string, 'null'], description: 'Nötige Funktion (download-Dateien immer downloads; null = voller Kurszugang)'}
        locked: {type: boolean}
        url: {type: [string, 'null'], format: uri, description: 'GET /files/{fileId} (mit Token und X-Tenant-Slug); null, wenn gesperrt'}
        requires_authorization: {type: boolean, const: true}
    Module:
      type: object
      properties:
        id: {type: string}
        code: {type: string}
        name: {type: string}
        description: {type: [string, 'null']}
        order: {type: integer}
        locked: {type: boolean, description: 'Modul per Drip-Regel noch gesperrt'}
        lock_reason: {type: [string, 'null'], enum: [drip, trial, null], description: 'drip = erst ab unlock_at, trial = nur die ersten Fragen freigegeben'}
        unlock_at: {type: [string, 'null'], format: date-time}
        question_count: {type: integer, description: 'Freigegebene Fragen'}
        catalog_count: {type: integer, description: 'Alle gültigen Fragen des Moduls'}
        progress: {$ref: '#/components/schemas/ProgressSummary'}
        topics:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              question_count: {type: integer}
              progress: {$ref: '#/components/schemas/ProgressSummary'}
    Media:
      type: object
      required: [kind, available, label]
      properties:
        kind: {type: string, enum: [image, video, placeholder]}
        available: {type: boolean}
        label: {type: string}
        url: {type: [string, 'null'], format: uri, description: 'Bei Platzhaltern immer null. Geschützte Fragenbilder: signierte, kurzlebige Adresse (120 Minuten, ohne Token abrufbar), nicht dauerhaft speichern.'}
        file_id: {type: [string, 'null'], format: uuid, description: 'Nur bei Fragenbildern mit freigegebenen Rechten'}
        download_url: {type: [string, 'null'], format: uri, description: 'Geprüfter Download über GET /files/{fileId} (mit Token und X-Tenant-Slug), z. B. zum Offline-Speichern'}
        mime_type: {type: [string, 'null']}
        duration_seconds: {type: [integer, 'null']}
        placeholder_reason: {type: [string, 'null'], enum: [awaiting_asset, unavailable, null]}
    Question:
      type: object
      properties:
        id: {type: string}
        revision_id: {type: string}
        official_number: {type: [string, 'null']}
        text: {type: string}
        question_type: {type: string, enum: [single_choice, multi_choice, open_text]}
        answer_selection: {type: string, enum: [single, multiple, self_assessment]}
        prompt_media: {type: array, items: {$ref: '#/components/schemas/Media'}}
        answers:
          type: array
          description: 'Ohne Kennzeichnung der richtigen Antwort; leer bei offenen Fragen. Einfachauswahl je Person gemischt (wie im Web), Mehrfachauswahl in gepflegter Reihenfolge.'
          items:
            type: object
            properties:
              id: {type: string}
              key: {type: string, description: 'Buchstabe der Anzeigeposition (A, B, C …)'}
              text: {type: string}
        topic: {type: [string, 'null']}
        module_id: {type: [string, 'null']}
        model_answer: {type: [string, 'null'], description: 'Nur bei offenen Fragen (Trainer; in der Prüfung erst nach reveal)'}
    Solution:
      type: object
      properties:
        correct_answer_ids: {type: array, items: {type: string}}
        model_answer: {type: [string, 'null']}
        explanation: {type: [string, 'null']}
    Streak:
      type: object
      properties:
        current: {type: integer, minimum: 0, maximum: 3}
        required: {type: integer, const: 3}
    TrainerQuestion:
      type: object
      properties:
        question: {$ref: '#/components/schemas/Question'}
        answer_token: {type: string, format: uuid, description: 'Für POST …/trainer/reveal (= ausgelieferte Revision)'}
        mode: {type: string}
        selection_reason: {type: [string, 'null']}
        is_favorite: {type: boolean}
        learning_state: {type: string, enum: [neu, unsicher, in_bearbeitung, gefestigt]}
        streak: {$ref: '#/components/schemas/Streak'}
    TrainerAnswerRequest:
      type: object
      required: [question_id, revision_id]
      properties:
        question_id: {type: string, format: uuid}
        revision_id: {type: string, format: uuid}
        mode: {type: string, enum: [smarttrainer, new, wrong, topic, favorites]}
        selected_answer_ids: {type: array, maxItems: 20, items: {type: string, format: uuid}, description: 'Einfachauswahl genau 1'}
        known: {type: boolean, description: 'Pflicht bei offenen Fragen (Selbsteinschätzung)'}
        client_answered_at: {type: string, format: date-time}
    TrainerAnswerResult:
      allOf:
        - {$ref: '#/components/schemas/Solution'}
        - type: object
          properties:
            attempt_id: {type: string}
            question_id: {type: string}
            correct: {type: boolean}
            selected_answer_ids: {type: array, items: {type: string}, description: Bei offenen Fragen leer}
            learning_state: {type: string, enum: [neu, unsicher, in_bearbeitung, gefestigt]}
            streak: {$ref: '#/components/schemas/Streak'}
            completed: {type: boolean, description: 'true = gefestigt'}
            progress:
              type: object
              properties:
                mastery_score: {type: number}
                current_streak: {type: integer}
            answered_at: {type: string, format: date-time}
    Favorite:
      type: object
      properties:
        question_id: {type: string}
        context: {type: string, enum: [smart_learning, exam]}
        collection_ids: {type: array, items: {type: string}}
        created_at: {type: string, format: date-time}
        question:
          type: [object, 'null']
          description: Kurzfassung für die Favoriten-Liste (ohne Lösung); null nur in der Antwort von PUT
          properties:
            official_number: {type: [string, 'null']}
            text: {type: string}
            question_type: {type: string}
            topic: {type: [string, 'null']}
            learning_state: {type: string, enum: [neu, unsicher, in_bearbeitung, gefestigt]}
            last_seen_at: {type: [string, 'null'], format: date-time}
    Mistake:
      type: object
      properties:
        question_id: {type: string}
        context: {type: string, const: smart_learning}
        wrong: {type: boolean, const: true}
        favorite: {type: boolean}
        collection_id: {type: [string, 'null'], description: 'Erste Sammlung (WP-kompatibel)'}
        collection_ids: {type: array, items: {type: string}}
        official_number: {type: [string, 'null']}
        text: {type: string, description: 'Fragetext ohne HTML'}
        question_type: {type: string}
        module: {type: [string, 'null']}
        topic: {type: [string, 'null']}
        learning_state: {type: string, enum: [neu, unsicher, in_bearbeitung, gefestigt]}
        last_seen_at: {type: [string, 'null'], format: date-time}
        saved_at: {type: [string, 'null'], format: date-time, description: 'Favorit gesetzt am'}
    FavoriteCollection:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        is_default: {type: boolean}
        favorite_count: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: [string, 'null'], format: date-time}
    FavoriteCollectionRequest:
      type: object
      required: [name]
      properties: {name: {type: string, maxLength: 60}}
    ExamOption:
      type: object
      properties:
        id: {type: string, description: 'Bogen-ID (fixed_paper) bzw. Regelwerk-ID (rule_set)'}
        kind: {type: string, enum: [fixed_paper, rule_set]}
        name: {type: string}
        group: {type: [string, 'null'], description: 'Teilprüfung im Kombikurs, z. B. „UBI“'}
        number: {type: [integer, 'null']}
        question_count: {type: integer}
        duration_seconds: {type: [integer, 'null']}
        pass_rule:
          type: [object, 'null']
          properties:
            description: {type: string}
            minimum_correct: {type: [integer, 'null']}
            minimum_score: {type: number}
            parts: {type: array, items: {type: object, properties: {label: {type: string}, min_correct: {type: integer}, of: {type: integer}}}}
            navigation: {type: [object, 'null'], properties: {min_points: {type: integer}, of: {type: integer}}}
            note: {type: [string, 'null']}
        startable: {type: boolean}
        running_exam_id: {type: [string, 'null']}
        last_result:
          type: [object, 'null']
          properties:
            exam_id: {type: string}
            passed: {type: boolean}
            score: {type: number}
            correct_count: {type: integer}
            question_count: {type: integer}
            navigation_points: {type: [integer, 'null']}
            evaluated_at: {type: string, format: date-time}
    ExamQuestion:
      allOf:
        - {$ref: '#/components/schemas/Question'}
        - type: object
          properties:
            position: {type: integer}
            flagged: {type: boolean}
            answered: {type: boolean}
            revealed: {type: boolean}
    ExamAnswer:
      type: object
      properties:
        question_id: {type: string}
        selected_answer_ids: {type: array, items: {type: string}}
        known: {type: [boolean, 'null']}
        answered_at: {type: string, format: date-time}
    ExamNavigation:
      type: [object, 'null']
      properties:
        task_id: {type: [string, 'null']}
        title: {type: string}
        scenario: {type: [string, 'null']}
        hint: {type: [string, 'null'], description: 'Erst bei der Selbsteinschätzung'}
        chart: {oneOf: [{$ref: '#/components/schemas/Media'}, {type: 'null'}]}
        rule: {type: [object, 'null'], properties: {min_points: {type: integer}, of: {type: integer}}}
        submitted_at: {type: [string, 'null'], format: date-time}
        points: {type: [integer, 'null']}
        passed: {type: [boolean, 'null']}
        parts:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              number: {type: integer}
              prompt: {type: string}
              chart_drawing: {type: boolean, description: 'In die Karte einzutragen (nichts zu tippen)'}
              answer: {type: [string, 'null']}
              auto_checkable: {type: boolean}
              auto_result: {type: [boolean, 'null']}
              solution: {type: [string, 'null'], description: 'Erst nach der Abgabe der Navigation'}
              needs_assessment: {type: boolean}
              self_assessed_known: {type: [boolean, 'null']}
              correct: {type: [boolean, 'null']}
    ExamSession:
      type: object
      properties:
        exam_id: {type: string}
        course_id: {type: string}
        paper_id: {type: [string, 'null']}
        name: {type: string}
        pass_rule: {type: string}
        status: {type: string, enum: [running, evaluated]}
        phase: {type: string, enum: [questions, ready_to_submit, navigation, navigation_assessment, evaluated], description: 'navigation auch nach Zeitablauf mit offenen Fragen (Nachfrist)'}
        started_at: {type: string, format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        server_time: {type: string, format: date-time}
        remaining_seconds: {type: [integer, 'null']}
        navigation_submit_until: {type: [string, 'null'], format: date-time, description: 'Letzter Zeitpunkt für die Abgabe der Navigation (Ende + 1 Min.)'}
        navigation_assessment_until: {type: [string, 'null'], format: date-time, description: 'Letzter Zeitpunkt für die Selbsteinschätzung (Ende + 15 Min.)'}
        question_count: {type: integer}
        answered_count: {type: integer}
        flagged_count: {type: integer}
