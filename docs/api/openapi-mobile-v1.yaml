              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [card_id, status]
                    properties:
                      card_id: {type: string, format: uuid}
                      status: {type: string, enum: [known, practice, open]}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/exam-registration:
    get:
      tags: [Courses]
      operationId: getExamRegistrationGuide
      summary: Prüfungsanmeldung und Prüfungsausschüsse
      description: Liefert die native Prüfungsanleitung des Kurses. Die App bucht keinen Termin; die Anmeldung erfolgt beim DSV/DMYV. Ein aktiver Kurszugang ist nicht erforderlich.
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {$ref: '#/components/parameters/CourseId'}
      responses:
        '200':
          description: Prüfungsanleitung
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [course_id, web_url, registration_in_app, guides, committees]
                    properties:
                      course_id: {type: string, format: uuid}
                      web_url: {type: string, format: uri}
                      registration_in_app: {type: boolean, const: false}
                      guides:
                        type: array
                        items:
                          type: object
                          required: [key, tab, title, variants, exam_parts, faq, providers]
                          additionalProperties: true
                          properties:
                            key: {type: string}
                            tab: {type: string}
                            title: {type: string}
                            intro: {type: [string, 'null']}
                            fee: {type: [string, 'null']}
                            fee_note: {type: [string, 'null']}
                            lead_time: {type: [string, 'null']}
                            min_age: {type: [string, 'null']}
                            apply: {type: [string, 'null']}
                            deadline: {type: [string, 'null']}
                            documents: {type: array, items: {type: string}}
                            variants: {type: array, items: {type: object, additionalProperties: true}}
                            exam_parts: {type: array, items: {type: object, additionalProperties: true}}
                            faq: {type: object, additionalProperties: {type: string}}
                            providers: {type: array, items: {type: object, additionalProperties: true}}
                      committees:
                        type: array
                        description: Allgemeine DSV/DMYV-Kontakte aus der nativen Prüfungsanleitung.
                        items:
                          type: object
                          required: [id, label, commission, matches]
                          additionalProperties: true
                          properties:
                            id: {type: string}
                            label: {type: string}
                            commission: {type: string}
                            website: {type: [string, 'null'], format: uri}
                            matches: {type: boolean}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/faqs:
    get:
      tags: [Courses]
      operationId: listCourseFaqs
      summary: Veröffentliche Kunden-FAQs nach Kurs und Unterkategorie
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/CourseId'}]
      responses:
        '200':
          description: Gruppierte Kunden-FAQs
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/CourseFaqGroup'}
                  meta:
                    type: object
                    required: [course_id, groups, faqs]
                    properties:
                      course_id: {type: string, format: uuid}
                      groups: {type: integer}
                      faqs: {type: integer}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Undurchsichtiges Access-Token (`bsa_…`), 15 Minuten gültig.
  parameters:
    TenantSlug:
      in: header
      name: X-Tenant-Slug
      required: true
      description: Kennung der Schule aus `memberships[].tenant_slug`.
      schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,119}$'}
    TenantSlugOptional:
      in: header
      name: X-Tenant-Slug
      required: false
      schema: {type: string}
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: UUID je fachlicher Aktion; Wiederholung liefert die gespeicherte Antwort, anderer Inhalt → 409 IDEMPOTENCY_KEY_REUSED.
      schema: {type: string, format: uuid}
    Page: {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
    PerPage: {in: query, name: per_page, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    CourseId: {in: path, name: courseId, required: true, schema: {type: string, format: uuid}}
    CollectionId: {in: path, name: collectionId, required: true, schema: {type: string, format: uuid}}
    QuestionId: {in: path, name: questionId, required: true, schema: {type: string, format: uuid}}
    AttemptId: {in: path, name: attemptId, required: true, schema: {type: string, format: uuid}}
    ExamId: {in: path, name: examId, required: true, schema: {type: string, format: uuid}}
    LessonId: {in: path, name: lessonId, required: true, schema: {type: string, format: uuid}}
    TaskId: {in: path, name: taskId, required: true, schema: {type: string, format: uuid}}
    SessionId: {in: path, name: sessionId, required: true, schema: {type: string, format: uuid}}
  responses:
    Problem:
      description: Fehler
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Accepted:
      description: Angenommen
      content:
        application/json:
          schema:
            type: object
            properties:
              data: {type: object, properties: {status: {type: string, const: accepted}}}
  schemas:
    Problem:
      type: object
      required: [title, status, code, request_id]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code:
          type: string
          description: Stabiler Fehlercode, siehe docs/api/README.md
          enum: [UNAUTHENTICATED, TWO_FACTOR_INVALID, VALIDATION_FAILED, RATE_LIMITED, FORBIDDEN, RESOURCE_NOT_FOUND, CONFLICT, GONE,
            METHOD_NOT_ALLOWED, SERVER_ERROR, SERVICE_UNAVAILABLE, REQUEST_FAILED,
            EMAIL_NOT_VERIFIED, TENANT_MEMBERSHIP_REQUIRED, TENANT_MEMBERSHIP_SUSPENDED, TENANT_UNAVAILABLE,
            ENTITLEMENT_REQUIRED, ENTITLEMENT_EXPIRED, PASSWORD_RESET_INVALID_OR_EXPIRED, IDEMPOTENCY_KEY_REUSED,
            COLLECTION_NOT_DELETABLE, EXAM_NOT_AVAILABLE, EXAM_ANSWER_LOCKED, EXAM_ALREADY_SUBMITTED, EXAM_EXPIRED,
            EXAM_NOT_SUBMITTED, EXAM_NO_NAVIGATION_PART, EXAM_NAVIGATION_ALREADY_SUBMITTED, EXAM_NAVIGATION_NOT_SUBMITTED,
            NAVIGATION_TASK_IN_EXAM, COUPON_INVALID, COUPON_NOT_APPLICABLE, EXPORT_EXPIRED,
            MAINTENANCE, APP_UPDATE_REQUIRED, EXAM_QUESTIONS_OPEN, EXAM_QUESTION_LOCKED, LINK_INVALID]
        errors: {type: object, additionalProperties: {type: array, items: {type: string}}}
        request_id: {type: string}
        exam_id: {type: string, description: Bei NAVIGATION_TASK_IN_EXAM}
        minimum_version: {type: string, description: Bei APP_UPDATE_REQUIRED}
        store_url: {type: [string, 'null'], description: Bei APP_UPDATE_REQUIRED}
    LoginRequest:
      type: object
      required: [email, password, device_name]
      properties:
        email: {type: string, format: email}
        password: {type: string}
        device_name: {type: string, maxLength: 100}
        device_platform: {type: string, enum: [ios, android]}
        app_version: {type: string, maxLength: 40}
    TokenPair:
      type: object
      required: [access_token, token_type, access_expires_at, refresh_token, refresh_expires_at, session_id]
      properties:
        access_token: {type: string}
        token_type: {type: string, const: Bearer}
        access_expires_at: {type: string, format: date-time}
        refresh_token: {type: string}
        refresh_expires_at: {type: string, format: date-time}
        session_id: {type: string}
    LoginResult:
      allOf:
        - {$ref: '#/components/schemas/TokenPair'}
        - type: object
          properties:
            user: {$ref: '#/components/schemas/User'}
            memberships: {type: array, items: {$ref: '#/components/schemas/Membership'}}
    TwoFactorChallenge:
      type: object
      required: [two_factor_required, challenge_token, challenge_expires_at]
      properties:
        two_factor_required: {type: boolean, const: true}
        challenge_token: {type: string}
        challenge_expires_at: {type: string, format: date-time}
    User:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        first_name: {type: [string, 'null']}
        last_name: {type: [string, 'null']}
        email: {type: string, format: email}
        email_verified: {type: boolean}
        two_factor_enabled: {type: boolean}
    Membership:
      type: object
      properties:
        tenant_slug: {type: string}
        tenant_name: {type: string}
        status: {type: string, enum: [active, suspended]}
        role: {type: string, const: learner}
        branding:
          type: object
          properties:
            logo_url: {type: [string, 'null'], format: uri}
            primary_color: {type: [string, 'null']}
            secondary_color: {type: [string, 'null']}
            support_email: {type: [string, 'null'], format: email}
        legal:
          type: object
          properties:
            imprint_url: {type: string, format: uri}
            privacy_url: {type: string, format: uri}
            account_url: {type: string, format: uri, description: 'Profil im Web (u. a. Konto löschen)'}
            data_rights_url: {type: string, format: uri, description: Datenrechte im Web}
    DeviceSession:
      type: object
      properties:
        id: {type: string}
        device_name: {type: string}
        device_platform: {type: [string, 'null']}
        app_version: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        last_used_at: {type: [string, 'null'], format: date-time}
        current: {type: boolean}
    Pagination:
      type: object
      properties:
        page: {type: integer}
        per_page: {type: integer}
        total: {type: integer}
        last_page: {type: integer}
    Entitlement:
      type: object
      required: [status, valid_from, valid_until]
      properties:
        status: {type: string, enum: [active, limited, pending, expired, suspended, revoked, not_granted]}
        valid_from: {type: [string, 'null'], format: date-time}
        valid_until: {type: [string, 'null'], format: date-time}
        trial: {type: boolean}
        purchased: {type: boolean}
        limits: {type: object, additionalProperties: {type: integer}}
        expires_soon: {type: boolean}
        expires_at: {type: [string, 'null'], format: date-time}
        renew_url: {type: [string, 'null'], format: uri}
    ProgressSummary:
      type: object
      required: [percent, completed, total]
      description: completed = gefestigte Fragen (3× richtig in Folge, Regeln wie im Web)
      properties:
        percent: {type: integer, minimum: 0, maximum: 100}
        completed: {type: integer}
        total: {type: integer}
        new: {type: integer}
        unsure: {type: integer}
        learning: {type: integer}
        mastered: {type: integer}
    FeatureAccess:
      type: object
      required: [available, full]
      properties:
        available: {type: boolean, description: Die Funktion ist durch Vollzugang oder Gruppen-Teilzugang nutzbar}
        full: {type: boolean, description: Der gesamte Funktionsumfang ist freigeschaltet}
        limit: {type: [integer, 'null']}
    CourseRelation:
      type: object
      required: [hidden, recommended, recommended_for]
      properties:
        hidden: {type: boolean}
        recommended: {type: boolean}
        recommended_for:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
    CourseSummary:
      type: object
      required: [id, code, slug, name, course_type, access, progress, capabilities, features, webshop_url, relation, faq_count]
      properties:
        id: {type: string}
        code: {type: string}
        slug: {type: string}
        name: {type: string}
        description: {type: [string, 'null']}
        course_type: {type: string, enum: [full, combo, addon]}
        access: {$ref: '#/components/schemas/Entitlement'}
        progress: {$ref: '#/components/schemas/ProgressSummary'}
        capabilities: {type: array, items: {type: string, enum: [smarttrainer, favorites, exam, video, navigation, praxis, funk]}}
        features:
          type: object
          description: Fähigkeit → Zugriff; Gruppenlizenzen können einzelne Fähigkeiten freischalten.
          additionalProperties: {$ref: '#/components/schemas/FeatureAccess'}
        webshop_url: {type: [string, 'null'], format: uri}
        relation: {$ref: '#/components/schemas/CourseRelation'}
        faq_count: {type: integer, minimum: 0}
        last_activity_at: {type: [string, 'null'], format: date-time, description: Letzte Antwort in diesem Kurs}
    Offer:
      type: object
      required: [name, url, price]
      properties:
        name: {type: string}
        url: {type: string, format: uri}
        price: {type: string}
    CourseChartRef:
      allOf:
        - {$ref: '#/components/schemas/FileRef'}
        - type: object
          required: [code]
          properties:
            code: {type: string}
    DeviceSimulatorLink:
      type: object
      required: [available, premium, tier, web_url, open_in, hint, webshop_url]
      properties:
        available: {type: boolean}
        premium: {type: boolean}
        tier: {type: [string, 'null'], enum: [free, premium, null]}
        web_url: {type: [string, 'null'], format: uri}
        open_in: {type: string, const: browser}
        hint: {type: [string, 'null']}
        webshop_url: {type: [string, 'null'], format: uri}
    KnotsSummary:
      type: object
      required: [available, locked, module_id, lessons, completed, unlock_at, webshop_url]
      properties:
        available: {type: boolean}
        locked: {type: boolean}
        module_id: {type: string, format: uuid}
        lessons: {type: integer}
        completed: {type: integer}
        unlock_at: {type: [string, 'null'], format: date-time}
        webshop_url: {type: [string, 'null'], format: uri}
    FileRef:
      type: object
      required: [id, title, locked, url, requires_authorization]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        description: {type: [string, 'null']}
        size_bytes: {type: [integer, 'null']}
        locked: {type: boolean}
        url: {type: [string, 'null'], format: uri, description: Protected API download URL}
        requires_authorization: {type: boolean, const: true}
    Module:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: [string, 'null']}
        code: {type: string}
        order: {type: integer}
        locked: {type: boolean}
        lock_reason: {type: [string, 'null'], enum: [drip, trial, null]}
        unlock_at: {type: [string, 'null'], format: date-time}
        catalog_count: {type: integer}
        question_count: {type: integer}
        progress: {$ref: '#/components/schemas/ProgressSummary'}
        topics:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              question_count: {type: integer}
              progress: {$ref: '#/components/schemas/ProgressSummary'}
    Media:
      type: object
      required: [kind, available, label]
      properties:
        kind: {type: string, enum: [image, video, placeholder]}
        available: {type: boolean}
        label: {type: string}
        alt: {type: [string, 'null']}
        url: {type: [string, 'null'], format: uri, description: 'Bei Platzhaltern immer null'}
        file_id: {type: [string, 'null'], format: uuid}
        download_url: {type: [string, 'null'], format: uri, description: Geschützter API-Download für Medien mit Lizenzrechten}
        mime_type: {type: [string, 'null']}
        duration_seconds: {type: [integer, 'null']}
        placeholder_reason: {type: [string, 'null'], enum: [awaiting_asset, unavailable, null]}
    Question:
      type: object
      properties:
        id: {type: string}
        revision_id: {type: string}
        official_number: {type: [string, 'null']}
        text: {type: string}
        question_type: {type: string, enum: [single_choice, multi_choice, open_text]}
        answer_selection: {type: string, enum: [single, multiple, self_assessment]}
        prompt_media: {type: array, items: {$ref: '#/components/schemas/Media'}}
        answers:
          type: array
          description: 'Ohne Kennzeichnung der richtigen Antwort; leer bei offenen Fragen. Einfachauswahl je Person gemischt (wie im Web), Mehrfachauswahl in gepflegter Reihenfolge.'
          items:
            type: object
            properties:
              id: {type: string}
              key: {type: string, description: 'Buchstabe der Anzeigeposition (A, B, C …)'}
              text: {type: string}
        topic: {type: [string, 'null']}
        module_id: {type: [string, 'null']}
        model_answer: {type: [string, 'null'], description: 'Nur bei offenen Fragen (Trainer; in der Prüfung erst nach reveal)'}
    Solution:
      type: object
      properties:
        correct_answer_ids: {type: array, items: {type: string}}
        model_answer: {type: [string, 'null']}
        explanation: {type: [string, 'null']}
    Streak:
      type: object
      properties:
        current: {type: integer, minimum: 0, maximum: 3}
        required: {type: integer, const: 3}
    TrainerQuestion:
      type: object
      properties:
        question: {$ref: '#/components/schemas/Question'}
        mode: {type: string}
        selection_reason: {type: [string, 'null']}
        is_favorite: {type: boolean}
        learning_state: {type: string, enum: [neu, unsicher, in_bearbeitung, gefestigt]}
        streak: {$ref: '#/components/schemas/Streak'}
    TrainerAnswerRequest:
      type: object
      required: [question_id, revision_id]
      properties:
        question_id: {type: string, format: uuid}
        revision_id: {type: string, format: uuid}
        mode: {type: string, enum: [smarttrainer, new, wrong, topic, favorites]}
        selected_answer_ids: {type: array, maxItems: 20, items: {type: string, format: uuid}, description: 'Einfachauswahl genau 1'}
        known: {type: boolean, description: 'Pflicht bei offenen Fragen (Selbsteinschätzung)'}
        client_answered_at: {type: string, format: date-time}
    TrainerAnswerResult:
      allOf:
        - {$ref: '#/components/schemas/Solution'}
        - type: object
          properties:
            attempt_id: {type: string}
            question_id: {type: string}
            correct: {type: boolean}
            selected_answer_ids: {type: array, items: {type: string}, description: Bei offenen Fragen leer}
            learning_state: {type: string, enum: [neu, unsicher, in_bearbeitung, gefestigt]}
            streak: {$ref: '#/components/schemas/Streak'}
            completed: {type: boolean, description: 'true = gefestigt'}
            progress:
              type: object
              properties:
                mastery_score: {type: number}
                current_streak: {type: integer}
            answered_at: {type: string, format: date-time}
    Favorite:
      type: object
      properties:
        question_id: {type: string}
        context: {type: string, enum: [smart_learning, exam]}
        collection_ids: {type: array, items: {type: string}}
        created_at: {type: string, format: date-time}
        question:
          type: [object, 'null']
          description: Kurzfassung für die Favoriten-Liste (ohne Lösung); null nur in der Antwort von PUT
          properties:
            official_number: {type: [string, 'null']}
            text: {type: string}
            question_type: {type: string}
            topic: {type: [string, 'null']}
            learning_state: {type: string, enum: [neu, unsicher, in_bearbeitung, gefestigt]}
            last_seen_at: {type: [string, 'null'], format: date-time}
    FavoriteCollection:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        is_default: {type: boolean}
        favorite_count: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: [string, 'null'], format: date-time}
    FavoriteCollectionRequest:
      type: object
      required: [name]
      properties: {name: {type: string, maxLength: 60}}
    ExamOption:
      type: object
      properties:
        id: {type: string, description: 'Bogen-ID (fixed_paper) bzw. Regelwerk-ID (rule_set)'}
        kind: {type: string, enum: [fixed_paper, rule_set]}
        name: {type: string}
        group: {type: [string, 'null'], description: 'Teilprüfung im Kombikurs, z. B. „UBI“'}
        number: {type: [integer, 'null']}
        question_count: {type: integer}
        duration_seconds: {type: [integer, 'null']}
        pass_rule:
          type: [object, 'null']
          properties:
            description: {type: string}
            minimum_correct: {type: [integer, 'null']}
            minimum_score: {type: number}
            parts: {type: array, items: {type: object, properties: {label: {type: string}, min_correct: {type: integer}, of: {type: integer}}}}
            navigation: {type: [object, 'null'], properties: {min_points: {type: integer}, of: {type: integer}}}
            note: {type: [string, 'null']}
        startable: {type: boolean}
        running_exam_id: {type: [string, 'null']}
        last_result:
          type: [object, 'null']
          properties:
            exam_id: {type: string}
            passed: {type: boolean}
            score: {type: number}
            correct_count: {type: integer}
            question_count: {type: integer}
            navigation_points: {type: [integer, 'null']}
            evaluated_at: {type: string, format: date-time}
    ExamQuestion:
      allOf:
        - {$ref: '#/components/schemas/Question'}
        - type: object
          properties:
            position: {type: integer}
            flagged: {type: boolean}
            answered: {type: boolean}
            revealed: {type: boolean}
    ExamAnswer:
      type: object
      properties:
        question_id: {type: string}
        selected_answer_ids: {type: array, items: {type: string}}
        known: {type: [boolean, 'null']}
        flagged: {type: boolean}
        answered_at: {type: string, format: date-time}
    ExamNavigation:
      type: [object, 'null']
      properties:
        task_id: {type: [string, 'null']}
        title: {type: string}
        scenario: {type: [string, 'null']}
        hint: {type: [string, 'null'], description: 'Erst bei der Selbsteinschätzung'}
        chart: {oneOf: [{$ref: '#/components/schemas/Media'}, {type: 'null'}]}
        rule: {type: [object, 'null'], properties: {min_points: {type: integer}, of: {type: integer}}}
        submitted_at: {type: [string, 'null'], format: date-time}
        points: {type: [integer, 'null']}
        passed: {type: [boolean, 'null']}
        parts:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              number: {type: integer}
              prompt: {type: string}
              chart_drawing: {type: boolean, description: 'In die Karte einzutragen (nichts zu tippen)'}
              answer: {type: [string, 'null']}
              auto_checkable: {type: boolean}
              auto_result: {type: [boolean, 'null']}
              solution: {type: [string, 'null'], description: 'Erst nach der Abgabe der Navigation'}
              needs_assessment: {type: boolean}
              self_assessed_known: {type: [boolean, 'null']}
              correct: {type: [boolean, 'null']}
    ExamSession:
      type: object
      properties:
        exam_id: {type: string}
        course_id: {type: string}
        paper_id: {type: [string, 'null']}
        name: {type: string}
        pass_rule: {type: string}
        status: {type: string, enum: [running, evaluated]}
        phase: {type: string, enum: [questions, ready_to_submit, navigation, navigation_assessment, evaluated], description: 'navigation auch nach Zeitablauf mit offenen Fragen (Nachfrist)'}
        started_at: {type: string, format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        server_time: {type: string, format: date-time}
        remaining_seconds: {type: [integer, 'null']}
        navigation_submit_until: {type: [string, 'null'], format: date-time, description: 'Letzter Zeitpunkt für die Abgabe der Navigation (Ende + 1 Min.)'}
        navigation_assessment_until: {type: [string, 'null'], format: date-time, description: 'Letzter Zeitpunkt für die Selbsteinschätzung (Ende + 15 Min.)'}
        question_count: {type: integer}
        answered_count: {type: integer}
        flagged_count: {type: integer}
        questions: {type: array, items: {$ref: '#/components/schemas/ExamQuestion'}}
        answers: {type: array, items: {$ref: '#/components/schemas/ExamAnswer'}}
        navigation: {$ref: '#/components/schemas/ExamNavigation'}
    ExamSessionResponse:
      type: object
      properties: {data: {$ref: '#/components/schemas/ExamSession'}}
    ExamAnswerRequest:
      type: object
      properties:
        selected_answer_ids: {type: array, uniqueItems: true, maxItems: 20, items: {type: string, format: uuid}}
        known: {type: boolean, description: 'Offene Fragen nach reveal'}
    ExamAnswerSaved:
      type: object
      properties:
        saved: {type: boolean, const: true}
        question_id: {type: string}
        selected_answer_ids: {type: array, items: {type: string}}
        known: {type: [boolean, 'null']}
        saved_at: {type: string, format: date-time}
        answered_count: {type: integer}
        question_count: {type: integer}
    ExamResult:
      type: object
      properties:
        exam_id: {type: string}
        course_id: {type: string}
        paper_id: {type: [string, 'null']}
        name: {type: string}
        status: {type: string, const: evaluated}
        passed: {type: boolean, description: 'Gesamtquote UND alle Teilgrenzen UND Navigation'}
        score: {type: number}
        correct_count: {type: integer}
        question_count: {type: integer}
        unanswered_count: {type: integer}
        started_at: {type: string, format: date-time}
        evaluated_at: {type: string, format: date-time}
        rule_set_version: {type: [string, 'null']}
        pass_rule: {type: string}
        parts:
          type: array
          items:
            type: object
            properties:
              label: {type: string}
              correct: {type: integer}
              total: {type: integer}
              min_correct: {type: integer}
              of: {type: integer}
              passed: {type: boolean}
        self_assessed: {type: object, properties: {question_count: {type: integer}, correct_count: {type: integer}}}
        by_topic:
          type: array
          items: {type: object, properties: {topic: {type: string}, correct_count: {type: integer}, question_count: {type: integer}}}
        questions:
          type: array
          items:
            allOf:
              - {$ref: '#/components/schemas/Question'}
              - type: object
                properties:
                  position: {type: integer}
                  selected_answer_ids: {type: array, items: {type: string}}
                  known: {type: [boolean, 'null']}
                  answered: {type: boolean}
                  correct: {type: boolean}
                  solution: {$ref: '#/components/schemas/Solution'}
        navigation: {$ref: '#/components/schemas/ExamNavigation'}
    ExamResultResponse:
      type: object
      properties: {data: {$ref: '#/components/schemas/ExamResult'}}
    VideoLessonStep:
      type: object
      properties:
        id: {type: string}
        order: {type: integer}
        title: {type: string}
        description: {type: [string, 'null']}
        media: {type: array, items: {$ref: '#/components/schemas/Media'}}
    VideoLesson:
      type: object
      properties:
        id: {type: string}
        module_id: {type: string}
        title: {type: string}
        description: {type: [string, 'null']}
        duration_seconds: {type: integer}
        media: {$ref: '#/components/schemas/Media'}
        completed: {type: boolean}
        position_seconds: {type: integer}
        step_count: {type: [integer, 'null']}
        quiz_count: {type: integer}
        locked: {type: boolean}
        steps: {type: array, items: {$ref: '#/components/schemas/VideoLessonStep'}, description: 'Nur in GET /videos/{lessonId}'}
    VideoModule:
      type: object
      properties:
        id: {type: string}
        title: {type: string}
        order: {type: integer}
        standalone: {type: boolean, description: 'Eigenständiges Kapitel (z. B. Knoten), im Web als eigene Kachel'}
        group: {type: [string, 'null']}
        locked: {type: boolean}
        unlock_at: {type: [string, 'null'], format: date-time}
        lessons: {type: array, items: {$ref: '#/components/schemas/VideoLesson'}}
    NavigationTaskSummary:
      type: object
      properties:
        id: {type: string}
        number: {type: integer}
        title: {type: string}
        description: {type: [string, 'null']}
        part_count: {type: integer}
        status: {type: string, enum: [new, started, done]}
        correct_count: {type: integer}
        has_chart: {type: boolean}
        locked_by_exam: {type: boolean}
    NavigationTask:
      allOf:
        - {$ref: '#/components/schemas/NavigationTaskSummary'}
        - type: object
          properties:
            scenario: {type: string}
            hint: {type: [string, 'null']}
            chart: {oneOf: [{$ref: '#/components/schemas/Media'}, {type: 'null'}]}
            parts:
              type: array
              items:
                type: object
                properties:
                  id: {type: string}
                  number: {type: integer}
                  prompt: {type: string}
                  auto_checkable: {type: boolean}
                  chart_drawing: {type: boolean}
                  placeholder: {type: [string, 'null'], description: 'Eingabehilfe (z. B. Format „054°“)'}
                  own_answer: {type: [string, 'null']}
                  correct: {type: [boolean, 'null']}
                  solution: {type: [string, 'null'], description: 'Nur mit show_solution=true'}
    CouponRedemption:
      type: object
      properties:
        redeemed: {type: boolean, const: true}
        already_redeemed: {type: boolean}
        type: {type: string, enum: [course, course_renewal, product, group_license]}
        kind: {type: string, const: group_license, description: WP-compatible group redemption marker}
        group_name: {type: [string, 'null']}
        courses: {type: array, items: {type: object, properties: {course_id: {type: string, format: uuid}, code: {type: string}, name: {type: string}}}}
        course_id: {type: [string, 'null']}
        course_name: {type: [string, 'null']}
        entitlement: {oneOf: [{$ref: '#/components/schemas/Entitlement'}, {type: 'null'}]}
        product: {type: [object, 'null'], properties: {id: {type: string}, name: {type: string}}}
    ExportStatus:
      type: object
      properties:
        export_id: {type: string}
        status: {type: string, enum: [processing, ready, failed, expired]}
        download_url: {type: [string, 'null'], format: uri}
        download_url_expires_at: {type: [string, 'null'], format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    Tip:
      type: object
      required: [id, title, html, text, links]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        html: {type: string, description: 'Bereinigtes HTML; relative Links und Bilder absolut'}
        text: {type: string, description: 'Reiner Text mit Absatz- und Listenformatierung'}
        links:
          type: array
          items:
            type: object
            required: [url, text]
            properties:
              url: {type: string, format: uri}
              text: {type: string}
    TipGroup:
      type: object
      required: [id, slug, name, tips]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        name: {type: string}
        tips:
          type: array
          items: {$ref: '#/components/schemas/Tip'}
    TipsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/TipGroup'}
        meta:
          type: object
          required: [groups, tips]
          properties:
            groups: {type: integer}
            tips: {type: integer}
    CourseFaq:
      type: object
      required: [id, question, answer_html, answer_text, links]
      properties:
        id: {type: string, format: uuid}
        question: {type: string}
        answer_html: {type: string}
        answer_text: {type: string}
        links:
          type: array
          items:
            type: object
            required: [url, text]
            properties:
              url: {type: string, format: uri}
              text: {type: string}
    CourseFaqGroup:
      type: object
      required: [id, key, name, slug, faqs, subcategories]
      properties:
        id: {type: string, format: uuid}
        key: {type: string, description: 'WP/Laravel course code for this FAQ category'}
        name: {type: string}
        slug: {type: string}
        faqs:
          type: array
          items: {$ref: '#/components/schemas/CourseFaq'}
        subcategories:
          type: array
          items: {$ref: '#/components/schemas/CourseFaqSubcategory'}
    CourseFaqSubcategory:
      type: object
      required: [id, name, slug, parent_id, depth, faqs]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        parent_id: {type: string, format: uuid}
        depth: {type: integer}
        faqs:
          type: array
          items: {$ref: '#/components/schemas/CourseFaq'}

}
