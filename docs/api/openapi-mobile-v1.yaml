        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/texts/{textId}/evaluate:
    post:
      tags: [Radio]
      operationId: evaluateRadioText
      summary: Mitschrift/Übersetzung speichern und grob auswerten
      description: |
        `direction` nur bei Übersetzungen (Pflicht). Leere Felder werden nicht bewertet (`null`).
        Abgabe-Texte (`spelling`) sind nicht auswertbar (422).
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {$ref: '#/components/parameters/CourseId'}
        - {$ref: '#/components/parameters/RadioTextId'}
      requestBody:
        required: true
