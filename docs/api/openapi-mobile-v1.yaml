                      kind: {type: string}
                      situation_de: {type: string}
                      situation_en: {type: [string, 'null']}
                      fields:
                        type: array
                        items: {type: object, properties: {name: {type: string}, label: {type: string}, placeholder: {type: string}, multiline: {type: boolean}}}
                      answers: {type: object, additionalProperties: {type: [string, 'null']}}
                      done: {type: boolean}
                      previous_id: {type: [string, 'null']}
                      next_id: {type: [string, 'null']}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/practice/{scenarioId}/evaluate:
    post:
      tags: [Radio]
      operationId: evaluateRadioPractice
      summary: Eingaben speichern und gegen die Prüfpunkte auswerten
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {$ref: '#/components/parameters/CourseId'}
        - {$ref: '#/components/parameters/RadioScenarioId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
