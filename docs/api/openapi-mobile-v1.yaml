                        additionalProperties:
                          type: object
                          properties:
                            checks: {type: array, items: {type: object, properties: {label: {type: string}, ok: {type: boolean}}}}
                            solution: {type: string}
                            answer: {type: string}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/practice/{scenarioId}/done:
    put:
      tags: [Radio]
      operationId: setRadioPracticeDone
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {$ref: '#/components/parameters/CourseId'}
        - {$ref: '#/components/parameters/RadioScenarioId'}
      requestBody: {$ref: '#/components/requestBodies/RadioDone'}
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema:
                type: object
                properties: {data: {type: object, properties: {scenario_id: {type: string}, done: {type: boolean}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
