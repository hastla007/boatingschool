openapi: 3.1.0
info:
  title: BoatingSchool Mobile API
  version: 1.0.0
  description: |
    Schnittstelle der Lernenden-App (iOS/Android) für die BoatingSchool-Plattform.
    Gleiche Daten und gleiche Lern-/Prüfungslogik wie die Web-App.

    * Basis-URL: `https://<plattform-domain>/api/v1`
    * Anmeldung: `Authorization: Bearer <access_token>` (15 Minuten gültig, Erneuerung über `/auth/refresh`).
    * Schule: Header `X-Tenant-Slug` bei allen schulbezogenen Endpunkten (Kurse, Lernen, Prüfung, Videos, Navigation, Codes, Export).
    * Fehler: `application/problem+json` mit stabilem `code` und `request_id`.
    * Schreibende POST-Endpunkte mit `Idempotency-Key` (UUID) sind sicher wiederholbar (24 Stunden).
    * Zeitangaben: ISO 8601 in UTC (`2026-11-09T10:15:00Z`).
    * Empfohlen bei jeder Anfrage: `X-App-Platform` (`ios`/`android`) und `X-App-Version`. Ist eine
      Mindestversion hinterlegt und die App älter, kommt 426 `APP_UPDATE_REQUIRED` (mit `minimum_version`, `store_url`).
    * Wartung der Plattform: 503 `MAINTENANCE` mit `Retry-After`; `GET /app/config` zeigt den Status vorab.
    * Eine wiederholte Antwort aus dem Idempotenz-Speicher trägt den Header `Idempotent-Replayed: true`.

    Fachliche Abweichungen vom ursprünglichen Konzept: siehe `docs/api/README.md`.
servers:
  - url: https://{host}/api/v1
    variables:
      host: {default: app.example.de}
security:
  - BearerAuth: []
tags:
  - {name: Auth}
  - {name: Account}
  - {name: Courses}
  - {name: Trainer}
  - {name: Favorites}
  - {name: Exams}
  - {name: Videos}
  - {name: Navigation}
  - {name: Praxis}
  - {name: Radio}
  - {name: Groups}
  - {name: Files}
  - {name: Tips}
  - {name: Coupons}
  - {name: Privacy}

paths:
  # ---------------------------------------------------------------- App
  /health:
    get:
      tags: [Account]
      operationId: getHealth
      summary: Öffentlicher Health-Status der API
      security: []
      responses:
        '200':
          description: API erreichbar
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [status, api_version, server_time]
                    properties:
                      status: {type: string, const: ok}
                      api_version: {type: string, const: v1}
                      server_time: {type: string, format: date-time}
        '429': {$ref: '#/components/responses/Problem'}
  /app/config:
    get:
      tags: [Account]
      operationId: getAppConfig
      summary: Mindestversion, Store-Links und Wartung (vor dem Login)
      security: []
      responses:
        '200':
          description: Konfiguration
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      api_version: {type: string, const: v1}
                      minimum_version: {type: object, properties: {ios: {type: [string, 'null']}, android: {type: [string, 'null']}}}
                      store_url: {type: object, properties: {ios: {type: [string, 'null']}, android: {type: [string, 'null']}}}
                      maintenance: {type: object, properties: {active: {type: boolean}, message: {type: [string, 'null']}}}
                      server_time: {type: string, format: date-time}

  # --------------------------------------------------------------- Auth
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Anmelden (ohne Schule; die Mitgliedschaften kommen in der Antwort)
      description: |
        Liefert direkt Tokens -- oder, wenn für das Konto die Zwei-Faktor-Anmeldung aktiv ist,
        `two_factor_required: true` und ein `challenge_token` für `POST /auth/two-factor`.
        Begrenzung: 5 Fehlversuche je E-Mail+IP und 20 je Konto (15 Minuten) wie im Web.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Angemeldet oder zweiter Faktor nötig
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - {$ref: '#/components/schemas/LoginResult'}
                      - {$ref: '#/components/schemas/TwoFactorChallenge'}
        '401': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /auth/two-factor:
    post:
      tags: [Auth]
      operationId: loginTwoFactor
      summary: Zweiten Faktor (TOTP-Code oder Wiederherstellungscode) bestätigen
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_token]
              properties:
                challenge_token: {type: string}
                code: {type: string, description: '6-stelliger Code aus der Authenticator-App'}
                recovery_code: {type: string}
      responses:
        '200':
          description: Angemeldet
          content:
            application/json:
              schema:
                type: object
                properties: {data: {$ref: '#/components/schemas/LoginResult'}}
        '401': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshTokens
      summary: Tokens erneuern (Refresh-Token rotiert)
      description: |
        Jedes Refresh-Token gilt genau einmal. Wird das unmittelbar vorherige Refresh-Token erneut
        vorgelegt, endet die ganze Gerätesitzung (Schutz bei Diebstahl); ältere ergeben nur 401.
        Leerlauf max. 30 Tage, Sitzung höchstens 90 Tage. Begrenzung 10/Min. je Refresh-Token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties: {refresh_token: {type: string}}
      responses:
        '200':
          description: Neue Tokens
          content:
            application/json:
              schema:
                type: object
                properties: {data: {$ref: '#/components/schemas/TokenPair'}}
        '401': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Diese Gerätesitzung beenden
      responses:
        '204': {description: 'Abgemeldet'}
        '401': {$ref: '#/components/responses/Problem'}
  /auth/password/forgot:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Link zum Zurücksetzen des Passworts anfordern
      description: Antwortet immer 202 (keine Aussage, ob die Adresse existiert). Optional `X-Tenant-Slug` für das Branding der Mail.
      security: []
      parameters:
        - {$ref: '#/components/parameters/TenantSlugOptional'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: {email: {type: string, format: email}}
      responses:
        '202': {$ref: '#/components/responses/Accepted'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Neues Passwort mit dem Token aus der Mail setzen
      description: Beendet alle App-Sitzungen des Kontos. `invite=true` für den Link aus einer Einladung (Konto noch nicht aktiviert).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password, password_confirmation]
              properties:
                email: {type: string, format: email}
                token: {type: string}
                password: {type: string, minLength: 10}
                password_confirmation: {type: string}
                invite: {type: boolean, default: false}
      responses:
        '204': {description: 'Passwort gesetzt'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /auth/email/verification-notification:
    post:
      tags: [Auth]
      operationId: resendVerificationEmail
      summary: Bestätigungsmail erneut senden
      responses:
        '202':
          description: Gesendet oder schon bestätigt
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: {status: {type: string, enum: [sent, already_verified]}}
        '401': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}

  # ------------------------------------------------------------ Account
  /me:
    get:
      tags: [Account]
      operationId: getMe
      summary: Eigenes Profil und Mitgliedschaften (Teilnehmer-Rolle)
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: {$ref: '#/components/schemas/User'}
                      memberships: {type: array, items: {$ref: '#/components/schemas/Membership'}}
        '401': {$ref: '#/components/responses/Problem'}
  /me/settings:
    get:
      tags: [Account]
      operationId: getMobileSettings
      summary: Gerätesynchronisierte App-Einstellungen abrufen
      responses:
        '200':
          description: Einstellungen und aktuelle Version
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [settings, version, updated_at]
                    properties:
                      settings: {type: object, additionalProperties: true}
                      version: {type: integer, minimum: 0}
                      updated_at: {type: [string, 'null'], format: date-time}
        '401': {$ref: '#/components/responses/Problem'}
    put:
      tags: [Account]
      operationId: replaceMobileSettings
      summary: App-Einstellungen atomar ersetzen
      description: Maximal 8192 Bytes und vier Ebenen. Optional schützt If-Match oder expected_version vor konkurrierenden Änderungen; bei Konflikt liefert 409 VERSION_CONFLICT den aktuellen Stand.
      parameters:
        - in: header
          name: If-Match
          required: false
          schema: {type: string}
          description: ETag-Version aus GET /me/settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings: {type: object, additionalProperties: true}
                expected_version: {type: integer, minimum: 0}
      responses:
        '200':
          description: Gespeicherte Einstellungen und neue Version
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [settings, version, updated_at]
                    properties:
                      settings: {type: object, additionalProperties: true}
                      version: {type: integer, minimum: 0}
                      updated_at: {type: [string, 'null'], format: date-time}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /me/sessions:
    get:
      tags: [Account]
      operationId: listDeviceSessions
      summary: Angemeldete Geräte
      responses:
        '200':
          description: Gerätesitzungen
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/DeviceSession'}}
    delete:
      tags: [Account]
      operationId: revokeOtherDeviceSessions
      summary: Alle anderen Geräte abmelden (dieses bleibt angemeldet)
      responses:
        '204': {description: Abgemeldet}
        '401': {$ref: '#/components/responses/Problem'}
  /me/sessions/{sessionId}:
    delete:
      tags: [Account]
      operationId: revokeDeviceSession
      summary: Ein Gerät abmelden
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      responses:
        '204': {description: 'Abgemeldet'}
        '404': {$ref: '#/components/responses/Problem'}

  /auth/web-session:
    post:
      tags: [Auth]
      operationId: createWebSession
      summary: Einmal-URL für die eingebettete Webansicht
      description: >-
        Übergibt die angemeldete App-Sitzung einmalig an die Web-Lernansicht.
        Die URL enthält einen 60 Sekunden gültigen Einmal-Code, der an Konto und aktive
        App-Gerätesitzung gebunden ist. Die App muss die URL mit dem zurückgegebenen
        Verifier-Header laden. Verwaltungsrollen sind ausgeschlossen; Redirects sind
        ausschließlich innerhalb des Lernbereichs der aktuellen Website erlaubt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redirect]
              properties:
                redirect: {type: string, maxLength: 400}
      responses:
        '201':
          description: Einmal-URL
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [url, expires_at, expires_in, redirect, verifier, verifier_header]
                    properties:
                      url: {type: string, format: uri}
                      expires_at: {type: string, format: date-time}
                      expires_in: {type: integer, const: 60}
                      redirect: {type: string, format: uri}
                      verifier: {type: string}
                      verifier_header: {type: string, const: X-Boatingschool-Web-Verifier}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /me/deletion-request:
    post:
      tags: [Privacy]
      operationId: requestAccountDeletion
      summary: Kontolöschung beantragen
      description: >-
        Legt einen Löschantrag an und sendet eine Bestätigungsmail. Ein bestätigter Antrag
        wird durch die Bootsschule bearbeitet; die API löscht das Konto nicht sofort.
        Wiederholte Anträge liefern den vorhandenen offenen oder bestätigten Antrag zurück.
      responses:
        '202':
          description: Antrag angelegt oder bereits vorhanden
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [request_id, status, already_requested, message]
                    properties:
                      request_id: {type: string, format: uuid}
                      status: {type: string, enum: [pending_confirmation, confirmed]}
                      already_requested: {type: boolean}
                      message: {type: string}
        '401': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /me/deletion-request/confirm:
    post:
      tags: [Privacy]
      operationId: confirmAccountDeletionRequest
      summary: Löschantrag aus der Bestätigungsmail bestätigen
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id, confirm_key]
              properties:
                request_id: {type: string, format: uuid}
                confirm_key: {type: string, maxLength: 100}
      responses:
        '200':
          description: Löschantrag bestätigt
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [request_id, status, already_requested, message]
                    properties:
                      request_id: {type: string, format: uuid}
                      status: {type: string, enum: [pending_confirmation, confirmed]}
                      already_requested: {type: boolean}
                      message: {type: string}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}

  # ------------------------------------------------------------ Courses
  /files/{fileId}:
    get:
      tags: [Files]
      operationId: downloadProtectedFile
      summary: Geschützte Kursdatei oder Fragenmedium herunterladen
      description: |
        Kein Tenant-Header erforderlich. Unterstützt veröffentlichte Einträge aus dem nativen Kursdatei-
        Register sowie lizenzierte/veröffentlichte Medien an gültigen Fragen. Die passende Kursfähigkeit
        muss aktiv sein; Dateien ohne Fähigkeitsbindung erfordern Vollzugang. Unterstützt einen einzelnen
        HTTP-Range-Bereich; ein If-Range-Header fordert die vollständige Datei an.
      parameters:
        - {in: path, name: fileId, required: true, schema: {type: string, format: uuid}}
        - {in: header, name: Range, required: false, schema: {type: string, examples: ['bytes=1048576-']}}
        - {in: header, name: If-Range, required: false, schema: {type: string}}
      responses:
        '200': {description: Vollständige Datei, content: {application/octet-stream: {schema: {type: string, contentMediaType: application/octet-stream}}}}
        '206': {description: Angeforderter Teilbereich; Content-Range enthält Start, Ende und Dateigröße, content: {application/octet-stream: {schema: {type: string, contentMediaType: application/octet-stream}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '416': {$ref: '#/components/responses/Problem'}
  /me/groups:
    get:
      tags: [Groups]
      operationId: listMyGroups
      summary: Eigene Gruppenlizenzen und Mitglieder
      responses:
        '200': {description: Gruppenliste, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {type: object}}, meta: {type: object}}}}}}
        '401': {$ref: '#/components/responses/Problem'}
  /me/groups/{groupId}:
    get:
      tags: [Groups]
      operationId: getMyGroup
      summary: Eigene Gruppenlizenz
      parameters: [{in: path, name: groupId, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Gruppendetails, content: {application/json: {schema: {type: object, properties: {data: {type: object}}}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /me/groups/{groupId}/invites:
    post:
      tags: [Groups]
      operationId: inviteToMyGroup
      summary: Personen per E-Mail zur Gruppenlizenz einladen
      parameters:
        - {in: path, name: groupId, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, properties: {email: {type: string, format: email}, emails: {type: array, maxItems: 200, items: {type: string, maxLength: 320}}}}
      responses:
        '200': {description: Eingeladen und übersprungene Adressen}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /me/groups/{groupId}/members/{memberId}:
    delete:
      tags: [Groups]
      operationId: removeGroupMember
      summary: Gruppenmitglied oder offene Einladung entfernen
      parameters:
        - {in: path, name: groupId, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: memberId, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: reason, schema: {type: string, maxLength: 190}}
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, properties: {reason: {type: [string, 'null'], maxLength: 190}}}
      responses:
        '200': {description: Gruppe mit aktualisierten Mitgliedern}
        '404': {$ref: '#/components/responses/Problem'}
  /me/groups/{groupId}/join-code:
    post:
      tags: [Groups]
      operationId: regenerateGroupJoinCode
      summary: Beitrittscode erneuern
      parameters:
        - {in: path, name: groupId, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {description: Gruppe mit neuem Code; der vorige Code wird ungültig}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /groups/join/{token}:
    get:
      tags: [Groups]
      operationId: previewGroupJoin
      summary: Gruppenbeitritt vor dem Einlösen prüfen
      description: Zeigt die Vorschau eines Gruppen-Beitrittscodes oder einer persönlichen Einladung. Der Token wird nicht eingelöst.
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - in: path
          name: token
          required: true
          schema: {type: string, pattern: '^[gi][0-9a-fA-F]{32}$'}
      responses:
        '200':
          description: Vorschau auf den Gruppenbeitritt
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '401': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /courses:
    get:
      tags: [Courses]
      operationId: listCourses
      summary: Freigeschaltete und buchbare Kurse der Schule
      description: >-
        Listet veröffentlichte Kurse, für die diese Schule Zugänge bereitstellt. Freigeschaltete
        Kurse stehen zuerst; weitere buchbare Kurse enthalten ihren externen Webshop-Link.
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200':
          description: Kurse mit Zugang, Lernfortschritt und Fähigkeiten
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/CourseSummary'}}
                  meta:
                    type: object
                    properties:
                      tenant: {type: object, properties: {slug: {type: string}, name: {type: string}}}
                      renewal_webshop_url: {type: [string, 'null'], format: uri}
                      pagination: {$ref: '#/components/schemas/Pagination'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /courses/{courseId}:
    get:
      tags: [Courses]
      operationId: getCourse
      summary: Kursdetails auch bei gesperrtem Zugang
      description: Öffentliche Kursmetadaten sind für veröffentlichte, von der Schule angebotene Kurse abrufbar; geschützte Lerninhalte bleiben zugangspflichtig.
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/CourseId'}]
      responses:
        '200':
          description: Kurs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - {$ref: '#/components/schemas/CourseSummary'}
                      - type: object
                        properties:
                          modules_count: {type: integer}
                          exam_options_count: {type: integer}
                          downloads: {type: array, items: {$ref: '#/components/schemas/FileRef'}}
                          section_files: {type: object, additionalProperties: {type: array, items: {$ref: '#/components/schemas/FileRef'}}}
                          charts: {type: array, items: {$ref: '#/components/schemas/CourseChartRef'}}
                          favorites_count: {type: integer, minimum: 0}
                          trainers: {type: object, additionalProperties: true}
                          offers: {type: object, additionalProperties: {type: array, items: {$ref: '#/components/schemas/Offer'}}}
                          web_url: {type: string, format: uri}
                          device_simulator: {$ref: '#/components/schemas/DeviceSimulatorLink'}
                          knots: {oneOf: [{$ref: '#/components/schemas/KnotsSummary'}, {type: 'null'}]}
                          exam_registration:
                            type: object
                            required: [available, web_url]
                            properties:
                              available: {type: boolean}
                              web_url: {type: [string, 'null'], format: uri}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/overview:
    get:
      tags: [Courses]
      operationId: getCourseOverview
      summary: Fortschritt, Module und „Weiterlernen“
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/CourseId'}]
      responses:
        '200':
          description: Übersicht
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      course: {$ref: '#/components/schemas/CourseSummary'}
                      progress: {$ref: '#/components/schemas/ProgressSummary'}
                      continue_learning:
                        type: [object, 'null']
                        properties:
                          module_id: {type: [string, 'null']}
                          module_name: {type: [string, 'null']}
                          topic: {type: [string, 'null']}
                          mode: {type: string}
                          last_activity_at: {type: string, format: date-time}
                      modules: {type: array, items: {$ref: '#/components/schemas/Module'}}
        '403': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/modules:
    get:
      tags: [Courses]
      operationId: listModules
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/CourseId'}]
      responses:
        '200':
          description: Module mit Themen
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Module'}}
        '403': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/progress:
    get:
      tags: [Courses]
      operationId: getProgress
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/CourseId'}]
      responses:
        '200':
          description: Fortschritt
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      overall: {$ref: '#/components/schemas/ProgressSummary'}
                      answered_questions: {type: integer}
                      correct_answers: {type: integer}
                      incorrect_answers: {type: integer}
                      modules: {type: array, items: {$ref: '#/components/schemas/Module'}}
        '403': {$ref: '#/components/responses/Problem'}

  # ------------------------------------------------------------ Trainer
  /courses/{courseId}/trainer/next:
    get:
      tags: [Trainer]
      operationId: nextTrainerQuestion
      summary: Nächste Frage (Smarttrainer und weitere Lernmodi)
      description: Ohne Lösung. Bei offenen Fragen (`answer_selection = self_assessment`) enthält die Frage `model_answer` zum Aufdecken.
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {$ref: '#/components/parameters/CourseId'}
        - {in: query, name: mode, schema: {type: string, enum: [smarttrainer, new, wrong, topic, favorites], default: smarttrainer}}
        - {in: query, name: module_id, schema: {type: string, format: uuid}}
        - {in: query, name: topic, schema: {type: string}, description: 'Für mode=topic'}
        - {in: query, name: question_ids, schema: {type: string}, description: 'Kommagetrennte Frage-IDs. Mit mode=favorites: genau diese Favoriten (z. B. „diese Frage üben“). Sonst „Fehler üben“ wie im Web: Fragen mit laufender richtiger Serie fallen heraus.'}
        - {in: query, name: collection_id, schema: {type: string, format: uuid}, description: 'Eine Favoriten-Sammlung üben (setzt mode=favorites)'}
      responses:
        '200':
          description: Frage
          content:
            application/json:
              schema:
                type: object
                properties: {data: {$ref: '#/components/schemas/TrainerQuestion'}}
        '204': {description: 'Keine passende Frage: new = alles gesehen, wrong = keine falschen, favorites = keine (passenden) Favoriten, question_ids = alle erledigt. Im Smarttrainer kommen gefestigte Fragen zur Wiederholung; „alles geschafft“ zeigt progress.percent = 100.'}
        '404': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/trainer/reveal:
    post:
      tags: [Trainer]
      operationId: revealModelAnswer
      summary: Musterantwort einer offenen Frage anzeigen
      description: |
        `answer_token` ist die UUID der Revision aus der Antwort von
        `GET /courses/{courseId}/trainer/next`. Die API prüft erneut Kurszugang,
        Kurszuordnung und Veröffentlichungsstatus. Nur offene Fragen können aufgedeckt werden.
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {$ref: '#/components/parameters/CourseId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer_token]
              properties:
                answer_token: {type: string, format: uuid}
      responses:
        '200':
          description: Musterantwort
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [model_answer]
                    properties:
                      model_answer: {type: [string, 'null']}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /courses/{courseId}/attempts:
    post:
      tags: [Trainer]
      operationId: submitTrainerAnswer
      summary: Antwort im Lernmodus abgeben
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {$ref: '#/components/parameters/CourseId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TrainerAnswerRequest'}
      responses:
        '201':
          description: 'Bewertet, mit Lösung und Lernstand. 409 EXAM_QUESTION_LOCKED: Frage ist gerade Teil einer laufenden Prüfung (auch bei einer anderen Schule).'
          content:
            application/json:
              schema:
                type: object
                properties: {data: {$ref: '#/components/schemas/TrainerAnswerResult'}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/attempts/{attemptId}:
    get:
      tags: [Trainer]
      operationId: getTrainerAttempt
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/CourseId'}, {$ref: '#/components/parameters/AttemptId'}]
      responses:
        '200':
          description: Eigener Versuch
          content:
            application/json:
              schema:
                type: object
                properties: {data: {$ref: '#/components/schemas/TrainerAnswerResult'}}
        '404': {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------- Favorites
  /courses/{courseId}/mistakes:
    get:
      tags: [Trainer]
      operationId: listCourseMistakes
      summary: Falsch beantwortete Fragen des Kurses
      description: Gibt aktuell gültige Kursfragen zurück, deren letzter Lernstand eine falsche Antwort ist (Lernserie 0), nach letzter Aktivität absteigend. Favoriten- und Sammlungsangaben beziehen sich nur auf den angemeldeten Nutzer.
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {$ref: '#/components/parameters/CourseId'}
      responses:
        '200':
          description: Fehlerliste
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [question_id, context, wrong, favorite, collection_ids, official_number, text, module, topic, saved_at, created_at]
                      properties:
                        question_id: {type: string, format: uuid}
                        context: {type: string, const: smart_learning}
                        wrong: {type: boolean, const: true}
                        favorite: {type: boolean}
                        collection_id: {type: [string, 'null']}
                        collection_ids: {type: array, items: {type: string, format: uuid}}
                        official_number: {type: [string, 'null']}
                        text: {type: string}
                        module: {type: string}
                        topic: {type: [string, 'null']}
                        saved_at: {type: [string, 'null'], format: date-time}
                        created_at: {type: [string, 'null'], format: date-time, deprecated: true}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/favorites:
    get:
      tags: [Favorites]
      operationId: listFavorites
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {$ref: '#/components/parameters/CourseId'}
        - {in: query, name: collection_id, schema: {type: string, format: uuid}}
        - {in: query, name: context, schema: {type: string, enum: [smart_learning, exam]}}
      responses:
        '200':
          description: Favoriten
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Favorite'}}
  /courses/{courseId}/favorites/{questionId}:
    put:
      tags: [Favorites]
      operationId: putFavorite
      summary: Favorit setzen (wiederholbar), optional mit Sammlungen
      description: Ohne `collection_ids` landet die Frage in der Standard-Sammlung; mit `collection_ids` genau in diesen (mindestens eine eigene Sammlung des Kurses, sonst 422; Entfernen über DELETE).
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/CourseId'}, {$ref: '#/components/parameters/QuestionId'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                context: {type: string, enum: [smart_learning, exam], default: smart_learning}
                collection_ids: {type: array, items: {type: string, format: uuid}}
      responses:
        '200':
          description: Favorit
          content:
            application/json:
              schema:
                type: object
                properties: {data: {$ref: '#/components/schemas/Favorite'}}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Favorites]
      operationId: deleteFavorite
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {$ref: '#/components/parameters/CourseId'}
        - {$ref: '#/components/parameters/QuestionId'}
        - {in: query, name: context, schema: {type: string, enum: [smart_learning, exam], default: smart_learning}}
      responses:
        '204': {description: 'Entfernt'}
  /courses/{courseId}/favorite-collections:
    get:
      tags: [Favorites]
      operationId: listFavoriteCollections
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/CourseId'}]
      responses:
        '200':
          description: Sammlungen (Standard-Sammlung zuerst)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/FavoriteCollection'}}
    post:
      tags: [Favorites]
      operationId: createFavoriteCollection
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/CourseId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FavoriteCollectionRequest'}
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema:
                type: object
                properties: {data: {$ref: '#/components/schemas/FavoriteCollection'}}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/favorite-collections/{collectionId}:
    patch:
      tags: [Favorites]
      operationId: renameFavoriteCollection
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/CourseId'}, {$ref: '#/components/parameters/CollectionId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FavoriteCollectionRequest'}
      responses:
        '200':
          description: Umbenannt
          content:
            application/json:
              schema:
                type: object
                properties: {data: {$ref: '#/components/schemas/FavoriteCollection'}}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Favorites]
      operationId: deleteFavoriteCollection
      description: Die Standard-Sammlung lässt sich nicht löschen (409 COLLECTION_NOT_DELETABLE).
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/CourseId'}, {$ref: '#/components/parameters/CollectionId'}]
      responses:
        '204': {description: 'Gelöscht'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  # -------------------------------------------------------------- Exams
  /courses/{courseId}/exams:
    get:
      tags: [Exams]
      operationId: listExams
      summary: Startbare Prüfungen (feste Bögen oder Zufallsprüfung) mit letztem Ergebnis
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/CourseId'}]
      responses:
        '200':
          description: Prüfungen
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/ExamOption'}}
                  meta:
                    type: object
                    properties:
                      includes_navigation_task: {type: boolean}
                      rule_set_status: {type: string, enum: [verified, draft, none], description: 'draft = Regelwerk noch nicht freigegeben (Liste leer)'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Exams]
      operationId: startExam
      summary: Prüfung starten oder laufende fortsetzen
      description: Kurse mit festen Bögen brauchen `paper_id`. Läuft für den Bogen bereits eine Prüfung, kommt diese zurück (200).
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/CourseId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {paper_id: {type: [string, 'null'], format: uuid}}
      responses:
        '200':
          description: Laufende Prüfung fortgesetzt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExamSessionResponse'}
        '201':
          description: Neu gestartet
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExamSessionResponse'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/exam-sessions:
    get:
      tags: [Exams]
      operationId: listExamHistory
      summary: Bisherige (ausgewertete) Prüfungsversuche, neueste zuerst
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {$ref: '#/components/parameters/CourseId'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200':
          description: Versuche
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        exam_id: {type: string}
                        paper_id: {type: [string, 'null']}
                        name: {type: string}
                        passed: {type: boolean}
                        score: {type: number}
                        correct_count: {type: integer}
                        question_count: {type: integer}
                        navigation_points: {type: [integer, 'null']}
                        started_at: {type: string, format: date-time}
                        evaluated_at: {type: string, format: date-time}
                  meta: {type: object, properties: {pagination: {$ref: '#/components/schemas/Pagination'}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /exams/{examId}:
    get:
      tags: [Exams]
      operationId: getExam
      summary: Eigene Prüfung mit Status, Fragen (ohne Lösung) und gegebenen Antworten
      description: Ist die Zeit abgelaufen, wird die Prüfung dabei ausgewertet (`status = evaluated`).
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/ExamId'}]
      responses:
        '200':
          description: Prüfung
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExamSessionResponse'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /exams/{examId}/answers/{questionId}:
    put:
      tags: [Exams]
      operationId: saveExamAnswer
      summary: Antwort festschreiben
      description: |
        Speichert ohne Richtig/Falsch. Eine gegebene Antwort ist endgültig (wie im Web):
        dieselbe Antwort erneut → 200; eine andere → 409 `EXAM_ANSWER_LOCKED`.
        Offene Fragen: erst `POST …/reveal`, dann `known` senden. Nach Zeitablauf → 410 `EXAM_EXPIRED`.
      parameters:
        - {$ref: '#/components/parameters/TenantSlug'}
        - {$ref: '#/components/parameters/ExamId'}
        - in: path
          name: questionId
          required: true
          schema: {type: string}
          description: Prüfungsposition 1…n (WP-kompatibel) oder Fragen-UUID
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExamAnswerRequest'}
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema:
                type: object
                properties: {data: {$ref: '#/components/schemas/ExamAnswerSaved'}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '410': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /exams/{examId}/questions/{questionId}/reveal:
    post:
      tags: [Exams]
      operationId: revealExamModelAnswer
      summary: Musterantwort einer offenen Frage abrufen (FKN/SKN)
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/ExamId'}, {$ref: '#/components/parameters/QuestionId'}]
      responses:
        '200':
          description: Musterantwort
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: object, properties: {question_id: {type: string}, model_answer: {type: [string, 'null']}}}
        '409': {$ref: '#/components/responses/Problem'}
        '410': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /exams/{examId}/navigation:
    put:
      tags: [Exams]
      operationId: submitExamNavigation
      summary: Navigationsaufgabe abgeben (SBF See; einmalig, alle Teilantworten)
      description: 'Schlüssel sind die `navigation.parts[].id` der Prüfung. Erst nach dem Fragebogen (sonst 409 EXAM_QUESTIONS_OPEN), nach Zeitablauf bis `navigation_submit_until` (1 Minute Nachfrist für technische Verzögerungen; Antworten zählen wie zum Prüfungsende abgegeben).'
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/ExamId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers: {type: object, additionalProperties: {type: [string, 'null'], maxLength: 500}}
      responses:
        '200':
          description: Abgegeben; Phase `navigation_assessment` mit Musterlösungen
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExamSessionResponse'}
        '409': {$ref: '#/components/responses/Problem'}
        '410': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /exams/{examId}/navigation/assessment:
    post:
      tags: [Exams]
      operationId: assessExamNavigation
      summary: Selbsteinschätzung der Navigation; danach Auswertung der ganzen Prüfung
      description: '`known` je Teilfrage mit `needs_assessment = true` (Freitext, Karteneintrag, oder automatisch als falsch erkannt aber gleichwertig).'
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/ExamId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [known]
              properties:
                known: {type: object, additionalProperties: {type: [boolean, 'null']}}
      responses:
        '200':
          description: Ergebnis
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExamResultResponse'}
        '409': {$ref: '#/components/responses/Problem'}
        '410': {$ref: '#/components/responses/Problem'}
  /exams/{examId}/submit:
    post:
      tags: [Exams]
      operationId: submitExam
      summary: Prüfung abgeben und auswerten (wiederholbar, gleiches Ergebnis)
      description: 'Mit Navigationsteil, der noch nicht abgegeben ist: 409 EXAM_NAVIGATION_NOT_SUBMITTED, außer `without_navigation: true` (Navigation zählt dann 0 Punkte) oder die Abgabefrist ist vorbei.'
      parameters: [{$ref: '#/components/parameters/TenantSlug'}, {$ref: '#/components/parameters/ExamId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {without_navigation: {type: boolean, default: false}}
      responses:
        '200':
          description: Ergebnis
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExamResultResponse'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /exams/{examId}/answers/{questionId}/flag:
    put:
      tags: [Exams]
      operationId: flagExamQuestion
      summary: Prüfungsfrage zur Überprüfung markieren
      description: Setzt oder entfernt die Markierung einer laufenden Prüfungsfrage. questionId darf wie in WP der Position (1…n) oder kompatibel eine Fragen-UUID sein. Antwort und Bewertung bleiben unverändert.
      parameters:
        - {$ref: '#/components/parameters/ExamId'}
        - in: path
          name: questionId
          required: true
          schema: {type: string}
          description: Position 1…n (WP-kompatibel) oder Fragen-UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flagged]
              properties:
                flagged: {type: boolean}
      responses:
        '200':
          description: Markierung gespeichert
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [question_id, flagged, flagged_count]
                    properties:
                      question_id: {type: string}
                      flagged: {type: boolean}
                      flagged_count: {type: integer, minimum: 0}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '410': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /exams/{examId}/answers/{questionId}/reveal:
    post:
      tags: [Exams]
      operationId: revealExamAnswerAlias
      summary: Musterantwort einer offenen Prüfungsfrage anzeigen (WP-kompatibler Pfad)
      description: Gleiche Funktion wie POST /exams/{examId}/questions/{questionId}/reveal; der WP-Mobile-API-Pfad bleibt für App-Kompatibilität verfügbar.
      parameters:
        - {$ref: '#/components/parameters/ExamId'}
        - in: path
          name: questionId
          required: true
          schema: {type: string}
          description: Prüfungsposition 1…n (WP-kompatibel) oder Fragen-UUID
      responses:
        '200':
          description: Musterantwort
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      question_id: {type: string}
                      model_answer: {type: string}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /exams/{examId}/result:
    get:
      tags: [Exams]
      operationId: getExamResult
      summary: Ergebnis mit Lösungen (nur nach der Auswertung)
