          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/RadioPracticeGroup'}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/practice/{scenarioId}:
    get:
      tags: [Radio]
