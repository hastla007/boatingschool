        „Gewusst“ erhöht die Serie, „nicht gewusst“ setzt sie zurück; ab `streak_to_learn` gilt die Karte als gelernt.
        Optional `streak` = der Stand, den die App kennt. Weicht er ab, bleibt der Stand unverändert (`repeated: true`).
