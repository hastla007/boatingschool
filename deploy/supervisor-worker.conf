; Queue-Worker (derzeit optional: die App legt noch keine Queue-Jobs an,
; Mails laufen synchron). Sobald Jobs dazukommen, muss er laufen --
; app:check-production meldet hängende Jobs.
; Ablage: /etc/supervisor/conf.d/boatingschool-worker.conf, dann
;   supervisorctl reread && supervisorctl update
[program:boatingschool-worker]
command=php /var/www/boatingschool/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/boatingschool
user=deploy
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/boatingschool/storage/logs/worker.log
