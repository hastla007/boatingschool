; Queue-Worker -- PFLICHT: Sammel-Mails (Mitteilungen an Lernende und an
; die Schulen, „Alle erinnern“, Sammel-Einladungen) laufen als Queue-Jobs
; (QUEUE_CONNECTION=database). Ohne laufenden Worker bleiben sie liegen;
; app:check-production meldet Jobs, die länger als 15 Minuten warten.
; Wiederholung: jeder Sammel-Mail-Job versucht es höchstens 3-mal (nach 1, 5
; und 15 Minuten), danach steht er unter `php artisan queue:failed`.
; Nach jedem Deploy beendet `php artisan queue:restart` (deploy.sh) die
; Worker, supervisor startet sie mit dem neuen Code neu.
;
; Ablage: /etc/supervisor/conf.d/boatingschool-worker.conf, dann
;   supervisorctl reread && supervisorctl update
; Modus releases (deploy.sh): Pfade auf <basis>/current umstellen, z. B.
;   command=php /var/www/boatingschool/current/artisan queue:work ...
;   directory=/var/www/boatingschool/current
[program:boatingschool-worker]
command=php /var/www/boatingschool/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/var/www/boatingschool
user=deploy
numprocs=1
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
; Ein laufendes Paket (bis 50 Mails) darf zu Ende laufen.
stopwaitsecs=600
redirect_stderr=true
stdout_logfile=/var/www/boatingschool/storage/logs/worker.log
