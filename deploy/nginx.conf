# nginx-Variante (z. B. mit Laravel Forge/Ploi). Zertifikate:
# - Standard (Schulen unter lernen.example.de/<slug>): ein Zertifikat für die
#   zentrale Domain genügt (certbot --nginx -d lernen.example.de); dann
#   "*.lernen.example.de" unten aus server_name entfernen
# - nur bei TENANT_URL_MODE=subdomain: Wildcard-Zertifikat per DNS-Challenge
#   (certbot --dns-<anbieter> -d lernen.example.de -d '*.lernen.example.de')
# - eigene Domains der Schulen: je Domain ein Zertifikat (certbot --nginx -d …)
#   und einen eigenen server-Block bzw. die Domain dem Block unten hinzufügen.
#   Automatisch geht das nur mit Caddy (siehe deploy/Caddyfile).
# Ablage: /etc/nginx/sites-available/boatingschool, Pfade anpassen.

# Zugriffslog ohne Geheimnisse (Betriebsaudit OPS-9): ohne Query-String
# ($args: E-Mail-Adresse, Signatur, Codes, Token), Token im Pfad
# (Passwort-Reset, Support-Ansicht, Gruppeneinladung) unkenntlich, Referer
# ohne Query-String. map/log_format stehen hier im http-Kontext.
# Aufbewahrung 14 Tage: /etc/logrotate.d/nginx mit "daily" und "rotate 14".
map $uri $boatingschool_log_uri {
    "~^(?<prefix>.*/(?:reset-password|impersonate|groups/join)/)[^/]+" "${prefix}REDACTED";
    default $uri;
}
map $http_referer $boatingschool_log_referer {
    "~^(?<base>[^?]*)" $base;
    default "";
}
log_format boatingschool '$remote_addr - [$time_local] "$request_method $boatingschool_log_uri $server_protocol" '
                         '$status $body_bytes_sent "$boatingschool_log_referer" "$http_user_agent" $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name lernen.example.de *.lernen.example.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lernen.example.de *.lernen.example.de;

    ssl_certificate     /etc/letsencrypt/live/lernen.example.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lernen.example.de/privkey.pem;

    root /var/www/boatingschool/public;
    index index.php;
    charset utf-8;
    client_max_body_size 25m;

    access_log /var/log/nginx/boatingschool.access.log boatingschool;

    # Kein MIME-Sniffing. Achtung: add_header in einer location ersetzt alle
    # add_header der Ebene darüber -- deshalb dort jeweils wiederholt.
    add_header X-Content-Type-Options nosniff always;

    location /build/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Uploads (Logos, Bilder, PDFs): nur als Dateien, nie über PHP, direkt
    # aufgerufen nichts ausführen (z. B. Skript in einer SVG-Datei).
    location ^~ /storage/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
        try_files $uri =404;
        # ^~ überspringt die Regex-Locations unten: .php hier eigens sperren.
        location ~* \.php(/|$) {
            return 404;
        }
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        # Exporte großer Schulen (siehe php-fpm-pool.conf).
        fastcgi_read_timeout 300;
    }

    # Nur index.php läuft über PHP-FPM; jede andere .php-Datei -> 404
    # (sonst würde sie über "location /" als Quelltext ausgeliefert).
    location ~* \.php(/|$) {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
