# nginx-Variante (z. B. mit Laravel Forge/Ploi). Zertifikate:
# - zentrale Domain + Subdomains: Wildcard-Zertifikat per DNS-Challenge
#   (certbot --dns-<anbieter> -d lernen.example.de -d '*.lernen.example.de')
# - eigene Domains der Schulen: je Domain ein Zertifikat (certbot --nginx -d …)
#   und einen eigenen server-Block bzw. die Domain dem Block unten hinzufügen.
#   Automatisch geht das nur mit Caddy (siehe deploy/Caddyfile).
# Ablage: /etc/nginx/sites-available/boatingschool, Pfade anpassen.

server {
    listen 80;
    listen [::]:80;
    server_name lernen.example.de *.lernen.example.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lernen.example.de *.lernen.example.de;

    ssl_certificate     /etc/letsencrypt/live/lernen.example.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lernen.example.de/privkey.pem;

    root /var/www/boatingschool/public;
    index index.php;
    charset utf-8;
    client_max_body_size 25m;

    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
