; PHP-FPM-Pool für die App, z. B. nach /etc/php/8.3/fpm/pool.d/boatingschool.conf
; (die Standard-Datei www.conf dann deaktivieren oder Socket-Pfad in
; Caddyfile/nginx.conf anpassen). Läuft als derselbe Benutzer wie Deploy und
; Cron -- sonst gehören Log- und Cache-Dateien abwechselnd www-data und deploy
; ("Permission denied").
[boatingschool]
user = deploy
group = deploy
listen = /run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Uploads: Excel-Import bis 20 MB, PDFs 10 MB, Karten 8 MB (Webserver: 25 MB).
php_admin_value[upload_max_filesize] = 25M
php_admin_value[post_max_size] = 26M
; Exporte und Importe großer Schulen.
php_admin_value[memory_limit] = 512M
; php_value (nicht php_admin_value): der Schul-Export hebt das Limit per set_time_limit() auf.
php_value[max_execution_time] = 120
request_terminate_timeout = 300
